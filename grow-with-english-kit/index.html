<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho bài tập Grow With English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#f7f6f0;--card:#fff;--ink:#22301c;--mute:#5d6957;--line:#e2e4d8;--brand:#3f6e2a;--green:#5a923f;--orange:#e8742f;--hi:#fde5d3;--chip:#eef4e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131a11;--card:#1b2418;--ink:#e7eee2;--mute:#a3b09b;--line:#2e3a29;--brand:#8cc56b;--green:#8cc56b;--orange:#f0965c;--hi:#3e2b1d;--chip:#232f1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131a11;--card:#1b2418;--ink:#e7eee2;--mute:#a3b09b;--line:#2e3a29;--brand:#8cc56b;--green:#8cc56b;--orange:#f0965c;--hi:#3e2b1d;--chip:#232f1f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,sans-serif;padding:28px 16px 48px}
.wrap{max-width:560px;margin:0 auto}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--orange);font:italic 700 15px/1.2 "Times New Roman",Georgia,serif}
.brandrow img{width:44px;height:44px;object-fit:contain;border-radius:8px}
.gwe{color:var(--green)}.msm{color:var(--orange);margin-left:auto;text-align:right}
h1{font:700 28px/1.2 "Baloo 2",sans-serif;color:var(--brand);margin:18px 0 2px}
p{color:var(--mute);margin:0 0 14px}
.back{display:inline-block;margin-top:14px;font-size:14px;font-weight:600;color:var(--brand);text-decoration:none}
.item{display:block;padding:14px 16px;margin:10px 0;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink);font-weight:600}
.item:hover{border-color:var(--green);background:var(--chip)}
.item span{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.grp{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:14px;background:var(--card);text-decoration:none;color:var(--ink)}
.grp:hover{border-color:var(--orange);background:var(--chip)}
.grp b{font:700 24px/1.1 "Baloo 2",sans-serif;color:var(--brand)}
.grp span{font-size:13px;color:var(--mute)}
.grp em{font-style:normal;align-self:flex-start;font-size:12px;font-weight:600;background:var(--hi);color:var(--orange);border-radius:6px;padding:1px 8px;margin-top:4px}
.gate{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.gate input{font:inherit;flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gate button{font:600 15px "Be Vietnam Pro",sans-serif;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.err{color:#b0391a;font-weight:600;margin-top:8px}
</style></head><body><div class="wrap">
<div class="brandrow"><img src="logo.png" alt="Logo Grow with English"><span class="gwe">Grow with English</span><span class="msm">Tiếng Anh Ms. Minh Thư</span></div>
<div id="view"></div>
</div>
<script>
// Thêm bài mới: thêm 1 dòng vào items của khối tương ứng (khối mới: thêm 1 nhóm).
var GROUPS = [
  {id:'khoi-9', name:'Khối 9', sub:'Global Success 9 · Chuyên Anh 9', items:[
    ['unit1/', 'Unit 1 – Local Community', 'Global Success 9'],
    ['giuaky1-lop9/', 'Luyện đề kiểm tra giữa kỳ I – Lớp 9', '2 đề · 31 câu và 40 câu'],
    ['wordform-chuyen9/', 'Word Form · Chuyên Anh 9', 'Mỗi mục 30 câu · đáp án, nghĩa, giải thích']
  ]},
  {id:'khoi-12', name:'Khối 12', sub:'Global Success 12', items:[
    ['unit3-lop12/', 'Unit 3 – Green Living (Từ vựng)', 'Global Success 12 · bảng từ + 4 bài, 50 câu'],
    ['unit6/', 'Unit 6 – Artificial Intelligence', 'Global Success 12']
  ]},
  {id:'ielts', name:'IELTS', sub:'Speaking · Forecast theo quý', items:[
    ['speaking-q3-2026/', 'IELTS Speaking · Forecast Q3/2026', '5 topic · ghi âm, bài mẫu band 7.0']
  ]}
];
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function show(){
  var id = location.hash.slice(1), g = GROUPS.filter(function(x){ return x.id === id; })[0], h;
  if(g){
    h = '<a class="back" href="#">← Tất cả khối</a><h1>' + esc(g.name) + '</h1><p>Chọn bài để làm:</p>';
    g.items.forEach(function(it){ h += '<a class="item" href="' + it[0] + '">' + esc(it[1]) + '<span>' + esc(it[2]) + '</span></a>'; });
    document.title = g.name + ' · Kho bài tập Grow With English';
  } else {
    h = '<h1>Kho bài tập Grow With English - Ms. Minh Thư</h1><p>Chọn khối:</p><div class="grid">';
    GROUPS.forEach(function(x){ h += '<a class="grp" href="#' + x.id + '"><b>' + esc(x.name) + '</b><span>' + esc(x.sub) + '</span><em>' + x.items.length + ' bài</em></a>'; });
    h += '</div><p style="margin-top:18px;font-size:13px"><a href="#" id="lock" style="color:var(--mute)">Khoá Kho trên máy này</a></p>';
    document.title = 'Kho bài tập Grow With English';
  }
  document.getElementById('view').innerHTML = h;
  var lk = document.getElementById('lock');
  if(lk) lk.onclick = function(e){ e.preventDefault(); try{ localStorage.removeItem('gwe-gv'); }catch(err){} gate(); };
  window.scrollTo(0, 0);
}
/* Chỉ giáo viên xem Kho: nhập mã một lần, máy nhớ ('gwe-gv'); máy đã mở Kho thì trang bài tập mới hiện nút về Kho */
var GV_HASH = '96c7834b63fd832fe19a360951da842e81119277ad304fdffcfd42371dbc1558';
function isGV(){ try{ return localStorage.getItem('gwe-gv') === '1'; }catch(e){ return false; } }
function gate(){
  document.title = 'Kho bài tập Grow With English';
  document.getElementById('view').innerHTML = '<h1>Kho bài tập Grow With English - Ms. Minh Thư</h1>'
    + '<p>Trang dành cho giáo viên. Học sinh vui lòng dùng link bài tập cô gửi.</p>'
    + '<form id="gvf" class="gate"><input id="gvc" type="password" placeholder="Mã giáo viên" autocomplete="current-password" aria-label="Mã giáo viên"><button>Vào Kho</button></form><p id="gvm" class="err"></p>';
  document.getElementById('gvf').onsubmit = function(e){
    e.preventDefault();
    var v = document.getElementById('gvc').value.trim();
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(buf){
      var hex = [].map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
      if(hex === GV_HASH){ try{ localStorage.setItem('gwe-gv', '1'); }catch(err){} show(); }
      else document.getElementById('gvm').textContent = 'Mã chưa đúng.';
    });
  };
}
window.addEventListener('hashchange', function(){ if(isGV()) show(); });
if(isGV()) show(); else gate();
</script>
</body></html>
