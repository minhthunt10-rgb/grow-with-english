<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Form Chuyên Anh 9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Mỗi mục 30 câu: điền đủ → nộp (gửi điểm + từ sai về Sheet) → hiện đáp án, nghĩa, giải thích; "Làm lại để ôn" không gửi lại */
:root{
  --bg:#f7f6f0; --card:#ffffff; --ink:#22301c; --mute:#5d6957; --line:#e2e4d8;
  --brand:#3f6e2a; --brand-ink:#ffffff; --hi:#fde5d3; --hi-line:#e8a274; --green:#5a923f; --orange:#e8742f;
  --ok:#17703f; --ok-bg:#e3f1dc; --bad:#b0391a; --bad-bg:#fde8e3; --chip:#eef4e8;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px 18px}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:10px;border-bottom:3px solid var(--orange);font:italic 700 15px/1.2 "Times New Roman",Georgia,serif}
.brandrow img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex:0 0 auto}
.brandrow .gwe{color:var(--green)} .brandrow .msm{color:var(--orange);margin-left:auto;text-align:right}
.banner h1{color:var(--brand);font:700 26px/1.2 var(--f-display);margin:4px 0 2px}
.banner p{margin:0;color:var(--mute)}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none}
.back[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.info{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.info label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.info input{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.rule{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:13px}
@media(max-width:560px){.info{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;min-width:112px}
.tab b{display:block;font-size:13px}.tab span{font-size:12px;color:var(--mute)}
.tab.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tab.done span{color:var(--ok);font-weight:600}
h2{font:700 22px/1.2 var(--f-display);margin:0}
.lead{margin:4px 0 0;color:var(--mute);font-size:14px}
.q{border-top:1px dashed var(--line);padding:12px 0 2px}
.q:first-child{border-top:0;padding-top:4px}
.qn{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:7px;background:var(--hi);font-weight:700;font-size:12px;margin-right:6px;padding:0 4px}
.qs{margin:0}
.root{font-weight:700;color:var(--orange);white-space:nowrap}
.blank{font:inherit;width:11em;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--hi-line);background:var(--chip);color:var(--ink);border-radius:6px 6px 0 0}
.blank:focus{outline:2px solid var(--brand);outline-offset:1px}
.blank.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.blank.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ex{margin-top:8px;border-radius:10px;padding:9px 12px;font-size:14px;background:var(--ok-bg)}
.ex.bad{background:var(--bad-bg)}
.ex .ans{font-weight:700}
.ex .ans b{color:var(--ok)}
.ex.bad .ans b{color:var(--bad)}
.ex p{margin:3px 0}
.ex .vi{color:var(--mute);font-style:italic}
.ex .note{font-size:13px;color:var(--orange)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;background:var(--card);border:1px solid var(--line);margin-left:4px}
.btn{font:600 14px var(--f-body);background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.msg{font-size:13px;color:var(--mute)}
.msg.warn{color:var(--bad);font-weight:600}
.msg.ok{color:var(--ok);font-weight:600}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 34px/1 var(--f-display);color:var(--brand)}
.hub{display:grid;gap:10px}
.mlink{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.mlink:hover{border-color:var(--brand)}
.mlink .num{flex:0 0 auto;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--hi);color:var(--orange);font:700 22px/1 var(--f-display)}
.mlink .t{flex:1;min-width:0}
.mlink .t b{display:block;font:700 18px/1.25 var(--f-display);color:var(--brand)}
.mlink .t span{display:block;font-size:13px;color:var(--mute)}
.mlink .t span.ok{color:var(--ok);font-weight:600}
.mlink .go{color:var(--brand);font-weight:700;font-size:20px}
.part{font:700 18px/1.3 var(--f-display);margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line);color:var(--orange)}
.vq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.vq .mean{font-weight:600}
</style></head>
<body><div class="wrap">
<header class="banner">
  <div class="brandrow"><img src="../logo.png" alt="Logo Grow with English"><span class="gwe">Grow with English</span><span class="msm">Tiếng Anh Ms. Minh Thư</span></div>
  <a class="back" id="back" href="../#khoi-9" data-gv hidden>← Kho bài tập · Khối 9</a>
<script>try{if(localStorage.getItem("gwe-gv")==="1")[].forEach.call(document.querySelectorAll("[data-gv]"),function(a){a.hidden=false})}catch(e){}</script>
  <h1 id="h1">Word Form · Chuyên Anh 9</h1>
  <p id="sub">Mỗi mục là 1 bài: 30 câu Word Form + 20 câu viết từ tiếng Anh theo nghĩa.</p>
</header>

<section class="card info" id="info" hidden>
  <label>Họ và tên học sinh *<input id="sName" autocomplete="name" placeholder="VD: Nguyễn Minh Anh"></label>
  <label>Lớp *<input id="sClass" placeholder="VD: 9 Chuyên Anh"></label>
  <p class="rule">Điền đủ 50 câu mới nộp được. Lần nộp đầu tiên được gửi cho cô. Sau đó em có thể bấm <b>Làm lại để ôn</b> bao nhiêu lần tuỳ thích.</p>
</section>

<section id="main"></section>
</div>

<script src="../config.js"></script>
<script src="data-01.js"></script>
<script>
var SHEET_URL = window.GWE_SHEET_URL || '';
var UNIT = 'Word Form Chuyên Anh 9';
var PER = 30, NB = 20;              // mỗi mục: 30 câu Word Form + 20 câu nghĩa → từ (lấy trong 30 từ đó)
var WF = window.WF || [];
var NSEC = Math.ceil(WF.length / PER);
var M = parseInt(new URLSearchParams(location.search).get('m'), 10);   // ?m=1, ?m=2 … ; không có → danh sách mục
var K = (M >= 1 && M <= NSEC) ? M - 1 : -1;
var S = null;   // {a:{i:[..]}, b:{i:'..'}, done, sent, first:{score,max,sa,sb}, review}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function secRange(k){ return [k * PER, Math.min(WF.length, (k + 1) * PER)]; }

/* ---------- lưu trên máy học sinh (mỗi mục một khoá) ---------- */
function skey(k){ return 'gwe-wf9-m' + (k + 1); }
function loadSec(k){ try{ return JSON.parse(localStorage.getItem(skey(k)) || 'null'); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(skey(K), JSON.stringify(S)); }catch(e){} }
function saveWho(){ try{ localStorage.setItem('gwe-who', JSON.stringify({n:$('sName').value, c:$('sClass').value})); }catch(e){} }
function loadWho(){ try{ var o = JSON.parse(localStorage.getItem('gwe-who') || 'null'); if(o){ $('sName').value = o.n || ''; $('sClass').value = o.c || ''; } }catch(e){} }

/* ---------- chấm: bỏ hoa/thường, dấu gạch nối, khoảng trắng, chính tả Anh–Mỹ ---------- */
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’‘]/g, "'").replace(/[\s\-–.]/g, '')
    .replace(/is(e|es|ed|ing|ation|ations)$/, 'iz$1').replace(/our/g, 'or').replace(/artefact/, 'artifact');
}
function blanks(q){ return q[0].split('___').length - 1; }
function keys(q){ return blanks(q) > 1 ? q[1][0].split(/\s*,\s*/).map(function(x){ return [x]; }) : [q[1]]; }
function isRight(q, got){
  return keys(q).every(function(alts, j){ var g = norm(got[j] || ''); return g && alts.some(function(a){ return norm(a) === g; }); });
}
function isRightB(i, got){ var g = norm(got || ''); return !!g && WF[i][1].some(function(a){ return norm(a) === g; }); }

/* ---------- 20 câu phần B: chọn cố định theo số mục (mọi HS cùng đề) ---------- */
function pickB(k){
  var r = secRange(k), pool = [], seed = (k + 1) * 7919;
  for(var i = r[0]; i < r[1]; i++) if(blanks(WF[i]) === 1) pool.push(i);
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for(var j = pool.length - 1; j > 0; j--){ var t = Math.floor(rnd() * (j + 1)), x = pool[j]; pool[j] = pool[t]; pool[t] = x; }
  return pool.slice(0, NB);
}

/* ---------- danh sách mục ---------- */
function renderHub(){
  var h = '<div class="hub">';
  for(var k = 0; k < NSEC; k++){
    var r = secRange(k), s = loadSec(k);
    var st = s && s.first ? '<span class="ok">✓ Đã nộp: ' + s.first.score + '/' + s.first.max + '</span>' : '<span>Câu ' + (r[0] + 1) + '–' + r[1] + ' · 30 câu Word Form + ' + NB + ' câu nghĩa</span>';
    h += '<a class="mlink" href="?m=' + (k + 1) + '"><span class="num">' + (k + 1) + '</span><span class="t"><b>Mục ' + (k + 1) + '</b>' + st + '</span><span class="go" aria-hidden="true">›</span></a>';
  }
  $('main').innerHTML = h + '</div>';
}

/* ---------- một mục ---------- */
function qHtml(i){
  var q = WF[i], got = S.a[i] || [], show = S.done, right = show && isRight(q, got);
  var parts = esc(q[0]).split('___'), body = parts[0];
  for(var p = 1; p < parts.length; p++){
    body += '<input class="blank' + (show ? (right ? ' ok' : ' bad') : '') + '" data-i="' + i + '" data-j="' + (p - 1) + '" value="' + esc(got[p - 1] || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (show ? ' readonly' : '') + ' aria-label="Câu ' + (i + 1) + '">' + parts[p];
  }
  var h = '<div class="q"><p class="qs"><span class="qn">' + (i + 1) + '</span>' + body + ' <span class="root">(' + esc(q[2]) + ')</span></p>';
  if(show){
    h += '<div class="ex' + (right ? '' : ' bad') + '"><p class="ans">' + (right ? '✓ Đúng: ' : '✗ Đáp án: ') + '<b>' + esc(q[1].join(' / ')) + '</b><span class="tag">' + esc(q[3]) + '</span> : ' + esc(q[4]) + '</p>'
      + '<p>' + esc(q[5]) + '</p><p class="vi">' + esc(q[6]) + '</p>'
      + (q[7] ? '<p class="note">Ghi chú: ' + esc(q[7]) + '</p>' : '') + '</div>';
  }
  return h + '</div>';
}
function bHtml(i, n){
  var q = WF[i], got = S.b[i] || '', show = S.done, right = show && isRightB(i, got);
  var h = '<div class="q"><p class="qs vq"><span class="qn">' + n + '</span><span class="tag">' + esc(q[3]) + '</span><span class="mean">' + esc(q[4]) + ':</span>'
    + '<input class="blank vb' + (show ? (right ? ' ok' : ' bad') : '') + '" data-b="' + i + '" value="' + esc(got) + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (show ? ' readonly' : '') + ' aria-label="Nghĩa câu ' + n + '"></p>';
  if(show) h += '<div class="ex' + (right ? '' : ' bad') + '"><p class="ans">' + (right ? '✓ Đúng: ' : '✗ Đáp án: ') + '<b>' + esc(q[1].join(' / ')) + '</b> <span class="msg">(câu ' + (i + 1) + ' phần A)</span></p></div>';
  return h + '</div>';
}

function wrongList(){
  var r = secRange(K), out = [];
  for(var i = r[0]; i < r[1]; i++){
    var got = S.a[i] || [];
    if(!isRight(WF[i], got)) out.push({n:'A' + (i + 1), root:WF[i][2], got:got.join(', '), ans:WF[i][1].join(' / '), type:WF[i][3], mean:WF[i][4]});
  }
  pickB(K).forEach(function(i, x){
    if(!isRightB(i, S.b[i])) out.push({n:'B' + (x + 1), root:'Nghĩa: ' + WF[i][4], got:S.b[i] || '', ans:WF[i][1].join(' / '), type:WF[i][3], mean:WF[i][4]});
  });
  return out;
}
function scoreNow(){
  var r = secRange(K), sa = 0, sb = 0;
  for(var i = r[0]; i < r[1]; i++) if(isRight(WF[i], S.a[i] || [])) sa++;
  pickB(K).forEach(function(i){ if(isRightB(i, S.b[i])) sb++; });
  return {sa:sa, sb:sb, score:sa + sb, max:(r[1] - r[0]) + pickB(K).length};
}

function renderSec(){
  var r = secRange(K), B = pickB(K), h = '<div class="card">';
  h += '<h2>Mục ' + (K + 1) + ' · Câu ' + (r[0] + 1) + '–' + r[1] + '</h2>';
  if(S.done){
    var sc = scoreNow();
    h += '<div class="score" style="margin-top:8px"><span class="big">' + sc.score + '/' + sc.max + '</span><span class="msg">Phần A: ' + sc.sa + '/' + (r[1] - r[0]) + ' · Phần B: ' + sc.sb + '/' + B.length + '<br>' + (S.review ? 'Lần ôn lại' : 'Lần nộp chính') + (S.first ? ' · Điểm lần đầu gửi cô: ' + S.first.score + '/' + S.first.max : '') + '</span></div>';
    h += '<p class="msg' + (S.sent ? ' ok' : '') + '" id="sendMsg">' + (S.sent ? '✓ Đã gửi kết quả cho cô.' : (S.review ? '' : 'Đang gửi kết quả cho cô…')) + '</p>';
    if(sc.score === sc.max) h += '<p class="msg ok">Tuyệt vời, em đúng hết cả mục!</p>';
    h += '<div class="row"><button class="btn ghost" data-act="redo">Làm lại để ôn</button>' + (K + 1 < NSEC ? '<a class="btn" style="text-decoration:none" href="?m=' + (K + 2) + '">Sang Mục ' + (K + 2) + ' →</a>' : '') + '</div>';
  }
  h += '<h3 class="part">Phần A · Word Form (30 câu)</h3>';
  h += '<p class="lead">Viết dạng đúng của từ in hoa trong ngoặc. Không cần viết hoa; gạch nối và chính tả Anh–Mỹ (‑ise/‑ize, ‑our/‑or) đều được chấp nhận.</p>';
  for(var i = r[0]; i < r[1]; i++) h += qHtml(i);
  h += '<h3 class="part">Phần B · Viết từ tiếng Anh theo nghĩa (' + B.length + ' câu)</h3>';
  h += '<p class="lead">Các từ đều nằm trong 30 đáp án của phần A. Đọc nghĩa và loại từ, viết từ tiếng Anh vào ô.</p>';
  B.forEach(function(i, x){ h += bHtml(i, x + 1); });
  if(!S.done) h += '<div class="row"><button class="btn" data-act="submit">Nộp bài Mục ' + (K + 1) + '</button><span class="msg" id="subMsg"></span></div>';
  $('main').innerHTML = h + '</div>';
}

/* ---------- gửi về Google Sheet ---------- */
function send(){
  if(!SHEET_URL) return;
  var r = secRange(K);
  var payload = {type:'wordform', name:$('sName').value.trim(), cls:$('sClass').value.trim(), unit:UNIT,
    section:'Mục ' + (K + 1) + ' (câu ' + (r[0] + 1) + '–' + r[1] + ')', score:S.first.score, max:S.first.max, wrong:S.first.wrong};
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(){ S.sent = true; save(); var m = $('sendMsg'); if(m){ m.className = 'msg ok'; m.textContent = '✓ Đã gửi kết quả cho cô.'; } })
    .catch(function(){ var m = $('sendMsg'); if(m){ m.className = 'msg warn'; m.innerHTML = 'Chưa gửi được (mất mạng?). <button class="btn ghost" data-act="resend">Gửi lại</button>'; } });
}

function submit(){
  var r = secRange(K), miss = [], msg = $('subMsg');
  if(!$('sName').value.trim() || !$('sClass').value.trim()){ msg.className = 'msg warn'; msg.textContent = 'Em nhập họ tên và lớp ở trên trước nhé.'; $('sName').focus(); return; }
  for(var i = r[0]; i < r[1]; i++){
    var got = S.a[i] || [];
    for(var j = 0; j < blanks(WF[i]); j++) if(!(got[j] || '').trim()){ miss.push('A' + (i + 1)); break; }
  }
  pickB(K).forEach(function(i, x){ if(!(S.b[i] || '').trim()) miss.push('B' + (x + 1)); });
  if(miss.length){
    msg.className = 'msg warn'; msg.textContent = 'Còn ' + miss.length + ' câu chưa điền: ' + miss.slice(0, 12).join(', ') + (miss.length > 12 ? '…' : '');
    var first = miss[0], el = first[0] === 'A' ? document.querySelector('.blank[data-i="' + (first.slice(1) - 1) + '"]') : document.querySelector('.blank[data-b="' + pickB(K)[first.slice(1) - 1] + '"]');
    if(el) el.focus(); return;
  }
  S.done = true;
  var firstTime = !S.first;
  if(firstTime){ var sc = scoreNow(); S.first = {score:sc.score, max:sc.max, wrong:wrongList()}; S.review = false; }
  save(); renderSec(); window.scrollTo({top:$('main').offsetTop - 10, behavior:'smooth'});
  if(firstTime) send();
}

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.dataset.i !== undefined){ var i = +t.dataset.i; (S.a[i] = S.a[i] || [])[+t.dataset.j] = t.value; save(); }
  else if(t.dataset.b !== undefined){ S.b[+t.dataset.b] = t.value; save(); }
  if(t.id === 'sName' || t.id === 'sClass') saveWho();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.classList.contains('blank')){
    e.preventDefault(); var all = [].slice.call(document.querySelectorAll('.blank:not([readonly])')), n = all.indexOf(e.target) + 1;
    if(all[n]) all[n].focus();
  }
});
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var a = b.dataset.act;
  if(a === 'submit') submit();
  else if(a === 'redo'){ S.a = {}; S.b = {}; S.done = false; S.review = true; save(); renderSec(); window.scrollTo({top:$('main').offsetTop - 10, behavior:'smooth'}); }
  else if(a === 'resend') send();
});

if(K < 0){
  renderHub();
} else {
  var r0 = secRange(K);
  S = loadSec(K) || {a:{}, b:{}, done:false, sent:false};
