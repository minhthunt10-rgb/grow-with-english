<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Speaking · Q3/2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Cùng bộ màu với trang bài tập Unit; mỗi câu: nghe câu hỏi → tự ghi âm → mới mở bài mẫu */
:root{
  --bg:#f7f6f0; --card:#ffffff; --ink:#22301c; --mute:#5d6957; --line:#e2e4d8;
  --brand:#3f6e2a; --brand-ink:#ffffff; --hi:#fde5d3; --hi-line:#e8a274; --green:#5a923f; --orange:#e8742f;
  --ok:#17703f; --ok-bg:#e3f1dc; --bad:#b0391a; --bad-bg:#fde8e3; --chip:#eef4e8;
  --c1:#e8742f; --c1b:#fdf0e8; --c2:#5a923f; --c2b:#eaf3e3; --c3:#3a4a6b; --c3b:#e6e9f1; --c4:#d0567f; --c4b:#fbe9ef;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f;
  --c1b:#3a2618; --c2b:#1f3318; --c3:#9fb0d6; --c3b:#232b3d; --c4b:#3a1c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f;
  --c1b:#3a2618; --c2b:#1f3318; --c3:#9fb0d6; --c3b:#232b3d; --c4b:#3a1c27; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px 18px}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:10px;border-bottom:3px solid var(--orange);font:italic 700 15px/1.2 "Times New Roman",Georgia,serif}
.brandrow img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex:0 0 auto}
.brandrow .gwe{color:var(--green)} .brandrow .msm{color:var(--orange);margin-left:auto;text-align:right}

.banner h1{color:var(--brand);font:700 26px/1.2 var(--f-display);margin:4px 0 2px}
.banner p{margin:0;color:var(--mute)}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;margin-bottom:2px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{color:var(--brand);font-weight:600;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.info{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.info label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.info input{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.rule{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:13px}
@media(max-width:560px){.info{grid-template-columns:1fr}}
.sent{font-size:13px;color:var(--ok);font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;min-width:104px}
.tab b{display:block;font-size:13px}.tab span{font-size:12px;color:var(--mute)}
.tab.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tab.done span{color:var(--ok);font-weight:600}
h2{font:700 22px/1.2 var(--f-display);margin:0}
.lead{margin:4px 0 0;color:var(--mute);font-size:14px}
.instr{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.btn{font:600 14px var(--f-body);background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.rec{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--mute);font:13px var(--f-body);text-decoration:underline;cursor:pointer;padding:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.q{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.q:first-of-type{border-top:0;margin-top:0;padding-top:0}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--hi);font-weight:700;font-size:13px;margin-right:8px;padding:0 4px}
.qt{margin:0;font-weight:600}
audio{height:36px;max-width:100%}
.recinfo{font-size:13px;color:var(--mute)}
.recinfo.live{color:var(--bad);font-weight:600}
.sample{margin-top:10px;background:var(--ok-bg);border-radius:10px;padding:10px 12px}
.sample p{margin:4px 0}
.sample .h{font-weight:700;color:var(--ok);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.sample b{background:var(--hi);border-radius:4px;padding:0 3px;font-weight:600}
/* từ vựng */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fc{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit}
.fc:hover{border-color:var(--brand)}
.fc .w{font:700 18px/1.2 var(--f-display);color:var(--brand)}
.fc .ipa{font-size:13px;color:var(--mute)}
.fc .m{font-size:14px}
.fc .vi{font-size:14px;font-weight:600}
.fc.flip{background:var(--chip)}
.say{border:0;background:var(--chip);color:var(--brand);border-radius:8px;padding:2px 8px;font:600 12px var(--f-body);cursor:pointer;align-self:flex-start;margin-top:auto}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.opt.sel{border-color:var(--brand);background:var(--chip)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--brand);margin:0 2px}
.score{font:700 20px var(--f-display);color:var(--brand)}
/* part 2 */
.cue{border:2px solid var(--ink);border-radius:12px;padding:14px 16px}
.cue h3{font:700 18px/1.3 var(--f-display);margin:0 0 6px}
.cue ul{margin:4px 0 0;padding-left:20px}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;background:var(--chip);border-radius:12px;padding:12px 14px}
.clock{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:96px}
.phase{font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1 1 160px}
.bar i{display:block;height:100%;background:var(--brand);width:0}
textarea{font:inherit;width:100%;min-height:90px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;margin-top:8px}
/* sơ đồ tư duy */
.mm{display:grid;gap:10px;margin-top:10px}
.mm .root{justify-self:start;background:var(--chip);border:2px solid var(--brand);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:700}
.br{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:start}
.br>.k{border:2px solid;border-radius:10px;padding:6px 10px;font-weight:700;text-align:center}
.br ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.br li{border:1.5px solid;border-radius:9px;padding:5px 10px;font-size:14px;display:flex;gap:6px;flex-wrap:wrap}
.br li span{color:var(--mute)}
.b1 .k{border-color:var(--c1);background:var(--c1b)}.b1 li{border-color:var(--c1)}
.b2 .k{border-color:var(--c2);background:var(--c2b)}.b2 li{border-color:var(--c2)}
.b3 .k{border-color:var(--c3);background:var(--c3b)}.b3 li{border-color:var(--c3)}
.b4 .k{border-color:var(--c4);background:var(--c4b)}.b4 li{border-color:var(--c4)}
@media(max-width:520px){.br{grid-template-columns:1fr}.br>.k{justify-self:start}}
.peel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.peel div{border:2px solid;border-radius:10px;padding:8px 10px;font-size:13px}
.peel b{display:block;font-size:13px}
.peel .p{border-color:var(--c1);background:var(--c1b)}.peel .e1{border-color:var(--c2);background:var(--c2b)}
.peel .e2{border-color:var(--c3);background:var(--c3b)}.peel .l{border-color:var(--c4);background:var(--c4b)}
@media(max-width:620px){.peel{grid-template-columns:1fr 1fr}}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.formula span{border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;z-index:20}
</style></head><body>
<div class="wrap">
  <header class="banner">
    <div class="brandrow"><img src="../logo.png" alt="Logo Grow with English"><span class="gwe">Grow with English</span><span class="msm">Tiếng Anh Ms. Minh Thư</span></div>
    <a class="back" href="./">← Tất cả topic</a>
    <h1 id="h1">IELTS Speaking</h1>
    <p>Forecast Quý 3/2026 · Band mục tiêu 7.0. Học từ vựng, tự nói và ghi âm, rồi mới so với bài mẫu.</p>
  </header>
  <section class="card info">
    <label for="sName">Họ và tên học sinh *<input id="sName" placeholder="VD: Nguyễn Minh Anh" autocomplete="off"></label>
    <label for="sClass">Lớp *<input id="sClass" placeholder="VD: IELTS 7.0 – T3" autocomplete="off"></label>
    <p class="rule" id="saveRule"></p>
  </section>
  <nav class="tabs" id="tabs"></nav>
  <main id="main" class="wrap"></main>
  <nav class="card pager" id="pager" aria-label="Chuyển topic"></nav>
</div>
<div id="toast" hidden></div>
<script src="../config.js"></script>
<script>
var SHEET_URL = window.GWE_SHEET_URL || ''; // link nằm trong config.js (dùng chung mọi trang)
var TN = Math.max(1, Math.min(5, parseInt(new URLSearchParams(location.search).get('t'), 10) || 1));
document.write('<script src="t' + TN + '.js"><\/script>');
</script>
<script>
var T = window.TOPIC;
var UNIT = 'IELTS Speaking Q3-2026 - Topic ' + T.n + ' ' + T.name;
var PAGE = 'q3-2026-t' + T.n;
document.title = 'IELTS Speaking · ' + T.name;
document.getElementById('h1').textContent = 'IELTS Speaking · Topic ' + T.n + ': ' + T.name;

var S={tab:'vocab',flip:{},qa:{},qdone:false,open:{},recs:{},notes:''};
var $=function(id){return document.getElementById(id)};
var L=['A','B','C','D'];
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function plain(t){return String(t).replace(/<[^>]+>/g,'')}
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2800)}

/* ---------- Lưu trên máy học sinh: bản ghi âm (IndexedDB) + tiến độ (localStorage) ---------- */
var DB=null;
function dbOpen(cb){
  try{
    var rq=indexedDB.open('gwe-speaking',1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('recs')};
    rq.onsuccess=function(){DB=rq.result;cb()};
    rq.onerror=function(){cb()};
  }catch(e){cb()}
}
function dbPut(id,val){ if(!DB) return; try{DB.transaction('recs','readwrite').objectStore('recs').put(val,PAGE+'/'+id)}catch(e){} }
function dbLoadAll(cb){
  if(!DB) return cb();
  try{
    var st=DB.transaction('recs').objectStore('recs'), rq=st.openCursor();
    rq.onsuccess=function(){var c=rq.result; if(!c) return cb();
      var k=String(c.key); if(k.indexOf(PAGE+'/')===0){var v=c.value;S.recs[k.slice(PAGE.length+1)]={url:URL.createObjectURL(v.blob),blob:v.blob,ext:v.ext,secs:v.secs,sent:v.sent}}
      c.continue()};
    rq.onerror=function(){cb()};
  }catch(e){cb()}
}
function saveState(){ try{localStorage.setItem('gwe-'+PAGE,JSON.stringify({qa:S.qa,qdone:S.qdone,open:S.open,skip:S.skip||{},notes:S.notes}))}catch(e){} }
function loadState(){ try{var o=JSON.parse(localStorage.getItem('gwe-'+PAGE)||'null'); if(o){S.qa=o.qa||{};S.qdone=!!o.qdone;S.open=o.open||{};S.skip=o.skip||{};S.notes=o.notes||''}}catch(e){} }
function saveWho(){ try{localStorage.setItem('gwe-who',JSON.stringify({n:$('sName').value,c:$('sClass').value}))}catch(e){} }
function loadWho(){ try{var o=JSON.parse(localStorage.getItem('gwe-who')||'null'); if(o){$('sName').value=o.n||'';$('sClass').value=o.c||''}}catch(e){} }
function who(){ return {name:$('sName').value.trim(),cls:$('sClass').value.trim()} }

/* ---------- Gửi về cô: bài nói vào Google Drive, điểm từ vựng vào Google Sheet ---------- */
function post(obj){ return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)}) }
function sendAudio(id){
  var r=S.recs[id], w=who();
  if(!SHEET_URL){toast('Trang chưa gắn link gửi bài. Em bấm Tải bản ghi âm rồi gửi Zalo cho cô nhé.');return}
  if(!w.name||!w.cls){toast('Em nhập Họ tên và Lớp ở đầu trang trước khi nộp nhé.');$('sName').focus();return}
  if(!r||!r.blob) return;
  r.sending=true; render();
  var fr=new FileReader();
  fr.onload=function(){
    var data=String(fr.result).split(',')[1];
    post({type:'audio',name:w.name,cls:w.cls,unit:UNIT,qid:qLabel(id),question:plain(qText(id)),secs:r.secs,ext:r.ext,mime:r.blob.type||'audio/webm',data:data})
      .then(function(){r.sending=false;r.sent=true;dbPut(id,{blob:r.blob,ext:r.ext,secs:r.secs,sent:true});render();toast('Đã nộp bài nói cho cô.')},
            function(){r.sending=false;render();toast('Chưa nộp được, em kiểm tra mạng rồi bấm lại nhé.')});
  };
  fr.readAsDataURL(r.blob);
}
function sendQuiz(){
  var w=who(); if(!SHEET_URL||!w.name||!w.cls) return;
  var sc=quizScore();
  post({ts:new Date().toISOString(),name:w.name,cls:w.cls,unit:UNIT,latest:'vocab',sections:[{id:'vocab',title:'Từ vựng',score:sc,max:10}],total:sc,max:10,pct:sc*10,skills:[{k:'tv',n:'Từ vựng',got:sc,max:10}],comment:sc>=8?'Từ vựng tốt.':'Từ vựng: cần ôn lại các cụm từ của topic.'}).catch(function(){});
}
function qLabel(id){ var p=id.split('-'); return p[0]==='p2'?'Part 2':(p[0]==='p1'?'Part 1':'Part 3')+' câu '+(+p[1]+1) }

/* ---------- Đọc to bằng giọng máy (nếu trình duyệt hỗ trợ) ---------- */
var TTS='speechSynthesis' in window;
function speak(text,rate){
  if(!TTS){toast('Trình duyệt này chưa hỗ trợ đọc to.');return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(plain(text)); u.lang='en-GB'; u.rate=rate||0.95;
  var v=speechSynthesis.getVoices().filter(function(x){return /^en-GB/i.test(x.lang)})[0]||speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang)})[0];
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* ---------- Ghi âm ---------- */
var REC=null; // {id, mr, chunks, t0, iv}
var CAN_REC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function startRec(id,onFail){
  if(REC){stopRec();}
  if(!CAN_REC){toast('Máy/trình duyệt này không ghi âm được. Em vẫn tự nói to rồi xem bài mẫu nhé.');if(onFail)onFail();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr=new MediaRecorder(stream), r={id:id,mr:mr,chunks:[],t0:Date.now()};
    mr.ondataavailable=function(e){if(e.data.size)r.chunks.push(e.data)};
    mr.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      var type=mr.mimeType||'audio/webm', blob=new Blob(r.chunks,{type:type});
      if(S.recs[id]) URL.revokeObjectURL(S.recs[id].url);
      S.recs[id]={url:URL.createObjectURL(blob),blob:blob,ext:/mp4|aac/.test(type)?'m4a':(/ogg/.test(type)?'ogg':'webm'),secs:Math.round((Date.now()-r.t0)/1000),sent:false};
      dbPut(id,{blob:blob,ext:S.recs[id].ext,secs:S.recs[id].secs,sent:false});
      S.open[id]=S.open[id]||false; saveState(); render();
    };
    mr.start(); REC=r;
    r.iv=setInterval(function(){var el=$('ri-'+id); if(el) el.textContent='● Đang ghi âm '+fmt((Date.now()-r.t0)/1000)},500);
    render();
  },function(){toast('Chưa có quyền dùng micro. Em bấm cho phép micro, hoặc tự nói to rồi xem bài mẫu.');if(onFail)onFail()});
}
function stopRec(){ if(!REC) return; clearInterval(REC.iv); var r=REC; REC=null; if(r.mr.state!=='inactive') r.mr.stop(); }
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function recBlock(id){
  var live=REC&&REC.id===id, r=S.recs[id], h='<div class="row">';
  h+='<button class="btn ghost" data-act="say" data-id="'+id+'">🔊 Nghe câu hỏi</button>';
  h+= live ? '<button class="btn rec" data-act="stop">■ Dừng ghi âm</button><span class="recinfo live" id="ri-'+id+'">● Đang ghi âm 0:00</span>'
           : '<button class="btn rec" data-act="rec" data-id="'+id+'">● '+(r?'Ghi âm lại':'Ghi âm câu trả lời')+'</button>';
  h+='</div>';
  if(r && !live) h+=playBlock(id);
  return h;
}
function playBlock(id){
  var r=S.recs[id];
  var h='<div class="row"><audio controls src="'+r.url+'"></audio><span class="recinfo">'+fmt(r.secs)+'</span></div><div class="row">';
  if(SHEET_URL) h+= r.sending?'<span class="recinfo">Đang nộp…</span>':(r.sent?'<span class="sent">✓ Đã nộp cho cô</span><button class="link" data-act="send" data-id="'+id+'">Nộp lại</button>':'<button class="btn" data-act="send" data-id="'+id+'">📤 Nộp bài nói cho cô</button>');
  return h+'<a class="link" href="'+r.url+'" download="'+T.slug+'-'+id+'.'+r.ext+'">Tải bản ghi âm về máy</a></div>';
}
function revealBlock(id,inner){
  if(S.open[id]) return inner;
  var can=!!S.recs[id]||S.skip&&S.skip[id];
  return '<div class="row"><button class="btn" data-act="open" data-id="'+id+'"'+(can?'':' disabled')+'>Xem câu trả lời mẫu</button>'+(can?'':'<button class="link" data-act="skip" data-id="'+id+'">Không ghi âm được? Bấm vào đây</button>')+'</div>';
}

/* ---------- Các phần ---------- */
function tabsHTML(){
  var p1=T.p1.qs.filter(function(q,i){return S.open['p1-'+i]}).length, p3=T.p3.filter(function(q,i){return S.open['p3-'+i]}).length;
  var items=[['vocab','Từ vựng',S.qdone?'✓ '+quizScore()+'/10':'10 cụm từ'],['p1','Part 1',p1+'/'+T.p1.qs.length+' câu'],['p2','Part 2',S.open.p2?'✓ Đã xem mẫu':'Cue card 2 phút'],['p3','Part 3',p3+'/'+T.p3.length+' câu']];
  return items.map(function(t){var done=(t[0]==='vocab'&&S.qdone)||(t[0]==='p1'&&p1===T.p1.qs.length)||(t[0]==='p2'&&S.open.p2)||(t[0]==='p3'&&p3===T.p3.length);
    return '<button class="tab'+(S.tab===t[0]?' on':'')+(done?' done':'')+'" data-act="tab" data-id="'+t[0]+'"><b>'+t[1]+'</b><span>'+t[2]+'</span></button>'}).join('');
}
function quizScore(){return T.quiz.filter(function(q,i){return S.qa[i]===q[2]}).length}
function vocabHTML(){
  var h='<section class="card"><h2>Từ vựng & cụm từ</h2><p class="lead">Bấm vào thẻ để xem nghĩa tiếng Việt. Bấm 🔊 để nghe phát âm.</p><div class="cards" style="margin-top:12px">';
  T.vocab.forEach(function(v,i){ var f=S.flip[i];
    h+='<div class="fc'+(f?' flip':'')+'" role="button" tabindex="0" data-act="flip" data-i="'+i+'"><span class="w">'+esc(v[0])+'</span><span class="ipa">'+esc(v[1])+'</span>'+(f?'<span class="vi">'+esc(v[3])+'</span><span class="m">'+esc(v[2])+'</span>':'<span class="m" style="color:var(--mute)">Bấm để xem nghĩa</span>')+'<button class="say" data-act="sayw" data-i="'+i+'">🔊 Nghe</button></div>'; });
  h+='</div></section>';
  h+='<section class="card"><h2>Luyện nhanh</h2><p class="lead">Chọn cụm từ đúng cho mỗi câu (lấy từ bài mẫu Part 2). Làm đủ 10 câu rồi bấm Chấm điểm.</p>';
  T.quiz.forEach(function(q,i){
    h+='<div class="q"><p class="qt"><span class="qn">'+(i+1)+'</span>'+esc(q[0]).replace('___','<span class="blank"></span>')+'</p><div class="opts">';
    q[1].forEach(function(o,oi){ var c='opt'; if(S.qdone){ if(oi===q[2]) c+=' right'; else if(S.qa[i]===oi) c+=' wrong'; } else if(S.qa[i]===oi) c+=' sel';
      h+='<button class="'+c+'" data-act="pick" data-i="'+i+'" data-o="'+oi+'"'+(S.qdone?' disabled':'')+'><b style="color:var(--brand)">'+L[oi]+'.</b> '+esc(o)+'</button>'; });
    h+='</div></div>';
  });
  var n=Object.keys(S.qa).length;
  h+='<div class="row" style="margin-top:16px">'+(S.qdone?'<span class="score">'+quizScore()+'/10 câu đúng</span><button class="btn ghost" data-act="requiz">Làm lại</button>':'<button class="btn" data-act="grade"'+(n<10?' disabled':'')+'>Chấm điểm</button><span class="recinfo">Đã chọn '+n+'/10</span>')+'</div></section>';
  return h;
}
function p1HTML(){
  var h='<section class="card"><h2>Part 1 · '+esc(T.p1.title)+'</h2><p class="lead">Trả lời 2–4 câu cho mỗi câu hỏi.</p><div class="instr">Cách luyện: <b>Nghe câu hỏi</b> → bấm <b>Ghi âm</b>, tự trả lời trong khoảng 20–30 giây → nghe lại giọng mình → mở <b>câu trả lời mẫu</b> để so sánh và học cụm từ tô vàng.</div></section><section class="card">';
  T.p1.qs.forEach(function(q,i){ var id='p1-'+i;
    h+='<div class="q"><p class="qt"><span class="qn">'+(i+1)+'</span>'+esc(q[0])+'</p>'+recBlock(id);
    h+=revealBlock(id,'<div class="sample"><span class="h">Câu trả lời mẫu · band 7.0</span><p>'+q[1]+'</p><div class="row" style="margin-top:4px"><button class="btn ghost" data-act="saytext" data-k="p1" data-i="'+i+'">🔊 Nghe bài mẫu</button></div></div>')+'</div>';
  });
  return h+'</section>';
}
var P2={phase:'idle',left:0,iv:null};
function p2Start(skipPrep){
  clearInterval(P2.iv); P2.phase=skipPrep?'speak':'prep'; P2.left=skipPrep?120:60;
  if(skipPrep) startRec('p2');
  P2.iv=setInterval(p2Tick,1000); render();
}
function p2Tick(){
  P2.left--;
  if(P2.left<=0){
    if(P2.phase==='prep'){ P2.phase='speak'; P2.left=120; toast('Hết 1 phút chuẩn bị. Bắt đầu nói!'); startRec('p2'); }
    else { clearInterval(P2.iv); P2.phase='done'; stopRec(); toast('Hết 2 phút. Em nghe lại bài nói rồi xem bài mẫu nhé.'); }
    render(); return;
  }
  var c=$('clock'), b=$('tbar'); if(c) c.textContent=fmt(P2.left); if(b) b.style.width=(100-P2.left/(P2.phase==='prep'?60:120)*100)+'%';
}
function p2Stop(){ clearInterval(P2.iv); if(P2.phase==='speak') stopRec(); P2.phase='done'; render(); }
function mindmap(){
  var m=T.p2.map, h='<div class="mm"><div class="root">'+esc(m.root)+'</div>';
  m.br.forEach(function(b,i){ h+='<div class="br b'+(i+1)+'"><div class="k">'+esc(b[0])+'</div><ul>'+b[1].map(function(x){return '<li><b>'+esc(x[0])+'</b><span>→ '+esc(x[1])+'</span></li>'}).join('')+'</ul></div>'; });
  return h+'</div>';
}
function p2HTML(){
  var p=T.p2, h='<section class="card"><h2>Part 2 · Cue card</h2><p class="lead">1 phút chuẩn bị (chỉ ghi từ khoá), 2 phút nói. Máy tự đếm giờ và tự ghi âm khi bắt đầu nói.</p>';
  h+='<div class="cue" style="margin-top:12px"><h3>'+esc(p.cue)+'</h3>You should say:<ul>'+p.say.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul></div>';
  var lbl={idle:'Sẵn sàng',prep:'Chuẩn bị – ghi từ khoá',speak:'Đang nói – máy đang ghi âm',done:'Đã xong'}[P2.phase];
  var total=P2.phase==='prep'?60:120, shown=P2.phase==='idle'?60:(P2.phase==='done'?0:P2.left);
  h+='<div class="timer"><span class="clock" id="clock">'+fmt(shown)+'</span><div style="flex:1 1 180px"><div class="phase">'+lbl+'</div><div class="bar" style="margin-top:6px"><i id="tbar" style="width:'+(P2.phase==='idle'?0:(P2.phase==='done'?100:100-P2.left/total*100))+'%"></i></div></div>';
  if(P2.phase==='idle'||P2.phase==='done') h+='<button class="btn" data-act="p2go">▶ '+(P2.phase==='done'?'Làm lại':'Bắt đầu')+'</button><button class="btn ghost" data-act="p2now">Nói luôn</button>';
  else h+='<button class="btn ghost" data-act="p2stop">■ Dừng</button>';
  h+='</div>';
  h+='<label style="display:block;margin-top:12px;font-weight:600;font-size:14px">Sơ đồ bài nói của em (từ khoá)<textarea id="notes" placeholder="'+esc(T.p2.map.br.map(function(b){return b[0]+": …"}).join("  /  "))+'">'+esc(S.notes)+'</textarea></label>';
  var r=S.recs.p2; if(r && P2.phase!=='speak') h+=playBlock('p2');
  h+=revealBlock('p2','<div class="sample" style="background:var(--card);padding:0"><span class="h" style="color:var(--brand)">Sơ đồ tư duy mẫu</span>'+mindmap()+'</div><div class="sample"><span class="h">Bài mẫu · band 7.0</span>'+p.sample.map(function(x){return '<p>'+x+'</p>'}).join('')+'<div class="row"><button class="btn ghost" data-act="sayp2">🔊 Nghe bài mẫu</button></div></div>');
  return h+'</section>';
}
function p3HTML(){
  var h='<section class="card"><h2>Part 3 · Thảo luận</h2><p class="lead">Mỗi câu trả lời 3–5 câu theo công thức PEEL.</p><div class="formula"><span style="background:var(--c1b);border:1.5px solid var(--c1)">Point · quan điểm</span><span style="background:var(--c2b);border:1.5px solid var(--c2)">Explain · giải thích</span><span style="background:var(--c3b);border:1.5px solid var(--c3)">Example · ví dụ thực tế</span><span style="background:var(--c4b);border:1.5px solid var(--c4)">Link · chốt lại</span></div></section><section class="card">';
  T.p3.forEach(function(q,i){ var id='p3-'+i;
    h+='<div class="q"><p class="qt"><span class="qn">'+(i+1)+'</span>'+esc(q[0])+'</p>'+recBlock(id);
    h+=revealBlock(id,'<div class="peel"><div class="p"><b>Point</b>'+esc(q[1][0])+'</div><div class="e1"><b>Explain</b>'+esc(q[1][1])+'</div><div class="e2"><b>Example</b>'+esc(q[1][2])+'</div><div class="l"><b>Link</b>'+esc(q[1][3])+'</div></div><div class="sample"><span class="h">Câu trả lời mẫu · band 7.0</span><p>'+q[2]+'</p><div class="row" style="margin-top:4px"><button class="btn ghost" data-act="saytext" data-k="p3" data-i="'+i+'">🔊 Nghe bài mẫu</button></div></div>')+'</div>';
  });
  return h+'</section>';
}
function render(){
  $('tabs').innerHTML=tabsHTML();
  $('main').innerHTML={vocab:vocabHTML,p1:p1HTML,p2:p2HTML,p3:p3HTML}[S.tab]();
}
function qText(id){ var p=id.split('-'); if(p[0]==='p1') return T.p1.qs[+p[1]][0]; if(p[0]==='p3') return T.p3[+p[1]][0]; return T.p2.cue }

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act, id=b.dataset.id, i=+b.dataset.i;
  if(a==='tab'){ if(REC||P2.phase==='prep'||P2.phase==='speak'){ if(!confirm('Đang ghi âm/đếm giờ. Chuyển trang sẽ dừng lại. Tiếp tục?')) return; stopRec(); clearInterval(P2.iv); if(P2.phase!=='idle')P2.phase='done'; }
    S.tab=id; render(); window.scrollTo({top:0}); }
  else if(a==='flip'&&!e.target.closest('.say')){ S.flip[i]=!S.flip[i]; render(); }
  else if(a==='sayw'){ e.stopPropagation(); speak(T.vocab[i][0].replace(' sth',' something').replace(' sb',' somebody'),0.85); }
  else if(a==='pick'){ if(S.qdone) return; S.qa[i]=+b.dataset.o; saveState(); render(); }
  else if(a==='grade'){ S.qdone=true; saveState(); render(); toast('Đúng '+quizScore()+'/10 câu.'); sendQuiz(); }
  else if(a==='requiz'){ S.qa={}; S.qdone=false; saveState(); render(); }
  else if(a==='send'){ sendAudio(id); }
  else if(a==='say'){ speak(qText(id)); }
  else if(a==='saytext'){ speak(b.dataset.k==='p1'?T.p1.qs[i][1]:T.p3[i][2]); }
  else if(a==='sayp2'){ speak(T.p2.sample.join(' ')); }
  else if(a==='rec'){ startRec(id); }
  else if(a==='stop'){ stopRec(); }
  else if(a==='skip'){ S.skip=S.skip||{}; S.skip[id]=true; saveState(); render(); }
  else if(a==='open'){ S.open[id]=true; saveState(); render(); }
  else if(a==='p2go'){ p2Start(false); }
  else if(a==='p2now'){ p2Start(true); }
  else if(a==='p2stop'){ p2Stop(); }
});
document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('fc')){e.preventDefault();e.target.click()} });
document.addEventListener('input',function(e){ if(e.target.id==='notes'){S.notes=e.target.value;saveState()} else if(e.target.id==='sName'||e.target.id==='sClass') saveWho(); });
if(TTS) speechSynthesis.onvoiceschanged=function(){};
$('saveRule').innerHTML='Bản ghi âm và bài làm được <b>giữ lại trên máy này</b>, tải lại trang vẫn còn. '+(SHEET_URL?'Bấm <b>📤 Nộp bài nói cho cô</b> dưới mỗi bản ghi để gửi bài nói về cho cô.':'Muốn gửi cô, em bấm <b>Tải bản ghi âm về máy</b> rồi gửi Zalo.');
$('pager').innerHTML=(T.n>1?'<a href="topic.html?t='+(T.n-1)+'">← Topic '+(T.n-1)+'</a>':'<a href="./">← Tất cả topic</a>')+(T.n<5?'<a href="topic.html?t='+(T.n+1)+'">Topic '+(T.n+1)+' →</a>':'<a href="./">Tất cả topic →</a>');
loadWho(); loadState(); render();
dbOpen(function(){ dbLoadAll(render) });
</script>
</body></html>
