<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cụm động từ &amp; Giới từ FCE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Kho cụm động từ + giới từ FCE Use of English 1–2. ?b=N mở bài N (≈30 từ). Bài tập tự sinh từ data.js:
   Thẻ từ (nghe) → A Nghe chọn cụm từ → B Chọn nghĩa → C Điền tiểu từ/giới từ (cả 30 từ) → D Ghép đôi → Nói thử (không chấm). */
:root{
  --bg:#f7f6f0; --card:#ffffff; --ink:#22301c; --mute:#5d6957; --line:#e2e4d8;
  --brand:#3f6e2a; --brand-ink:#ffffff; --hi:#fde5d3; --hi-line:#e8a274; --green:#5a923f; --orange:#e8742f;
  --ok:#17703f; --ok-bg:#e3f1dc; --bad:#b0391a; --bad-bg:#fde8e3; --chip:#eef4e8; --blue:#cfe8f7; --blue-ink:#0b5d8a;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; --blue:#163447; --blue-ink:#9fd3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; --blue:#163447; --blue-ink:#9fd3f2; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px 18px}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:10px;border-bottom:3px solid var(--orange);font:italic 700 15px/1.2 "Times New Roman",Georgia,serif}
.brandrow img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex:0 0 auto}
.brandrow .gwe{color:var(--green)} .brandrow .msm{color:var(--orange);margin-left:auto;text-align:right}
.banner h1{color:var(--brand);font:700 26px/1.2 var(--f-display);margin:4px 0 2px}
.banner p{margin:0;color:var(--mute)}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;margin-right:12px}
.back[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.info{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.info[hidden]{display:none}
.info label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.info input{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.rule{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:13px}
@media(max-width:560px){.info{grid-template-columns:1fr}}
h2{font:700 22px/1.2 var(--f-display);margin:0}
.lead{margin:4px 0 8px;color:var(--mute);font-size:14px}
.part{font:700 19px/1.3 var(--f-display);margin:26px 0 0;padding-top:12px;border-top:2px solid var(--line);color:var(--orange)}
.part small{font:600 13px var(--f-body);color:var(--mute)}
.q{border-top:1px dashed var(--line);padding:12px 0 6px}
.q.first{border-top:0}
.q.miss{outline:2px dashed var(--bad);outline-offset:4px;border-radius:8px}
.qn{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:7px;background:var(--hi);font-weight:700;font-size:12px;margin-right:6px;padding:0 4px}
.prompt{font-weight:600}
.gap{display:inline-block;min-width:4.5em;padding:0 8px;border-bottom:2px solid var(--hi-line);background:var(--chip);border-radius:6px 6px 0 0;text-align:center;font-weight:700;color:var(--brand)}
.gap.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.gap.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.hint{color:var(--mute);font-size:13px;font-style:italic}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.opts.inline{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.opts.inline .opt{padding:5px 14px;font-weight:600}
.opt:hover{border-color:var(--green)}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.ex{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:14px;background:var(--ok-bg)}
.ex.bad{background:var(--bad-bg)}
.ex b{color:var(--ok)} .ex.bad b{color:var(--bad)}
.ex p{margin:2px 0}
.ex .vi{color:var(--mute);font-style:italic}
.btn{font:600 14px var(--f-body);background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.msg{font-size:13px;color:var(--mute)}
.msg.warn{color:var(--bad);font-weight:600}
.msg.ok{color:var(--ok);font-weight:600}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 34px/1 var(--f-display);color:var(--brand)}
/* loa */
.say{font:inherit;border:0;background:var(--blue);color:var(--blue-ink);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;flex:0 0 auto}
.say svg{width:18px;height:18px}
.say.big{width:64px;height:64px}
.say.big svg{width:30px;height:30px}
.say.slow{width:auto;padding:0 12px;font-size:12px;font-weight:600;height:30px}
.listen{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* thẻ từ */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.fc{position:relative;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:12px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit}
.fc:hover{border-color:var(--green)}
.fc .em{font-size:38px;line-height:1.1}
.fc .ph{font:700 18px/1.2 var(--f-display);color:var(--brand)}
.fc .tag{font-size:11px;font-weight:600;color:var(--blue-ink);background:var(--blue);border-radius:6px;padding:0 6px;align-self:flex-start}
.fc .back2{display:none;font-size:13px}
.fc .back2 .vi{font-weight:600;color:var(--ink)}
.fc .back2 .en{color:var(--mute)}
.fc.open .back2{display:block}
.fc.open .tap{display:none}
.fc .tap{font-size:12px;color:var(--mute);margin-top:auto}
.fc .say{position:absolute;top:10px;right:10px}
.fc.seen{border-color:var(--green)}
/* tranh câu hỏi */
.pic{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pic .em{font-size:46px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:var(--chip);border-radius:14px;flex:0 0 auto}
/* ghép đôi */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.tile{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;min-height:46px;display:flex;align-items:center;gap:8px}
.tile .em{font-size:24px}
.tile.ph{font-weight:700;color:var(--brand)}
.tile.on{border-color:var(--orange);background:var(--hi)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);cursor:default;opacity:.75}
.tile.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tile.shake{animation:none}}
/* nói thử */
.spk{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.spk .w{font-weight:700;color:var(--brand);min-width:9em}
.spk .res{font-size:13px;color:var(--mute)}
.spk .res.ok{color:var(--ok);font-weight:600}
.mic{font:600 13px var(--f-body);border:1.5px solid var(--orange);background:var(--card);color:var(--orange);border-radius:999px;padding:4px 12px;cursor:pointer}
.mic.rec{background:var(--orange);color:#fff}
/* hub */
.hub{display:grid;gap:10px}
.mlink{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.mlink:hover{border-color:var(--brand)}
.mlink .num{flex:0 0 auto;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--hi);color:var(--orange);font:700 22px/1 var(--f-display)}
.mlink .t{flex:1;min-width:0}
.mlink .t b{display:block;font:700 18px/1.25 var(--f-display);color:var(--brand)}
.mlink .t span{display:block;font-size:13px;color:var(--mute)}
.mlink .t span.ok{color:var(--ok);font-weight:600}
.mlink .go{color:var(--brand);font-weight:700;font-size:20px}
.mlink.soon{opacity:.55;pointer-events:none}
.search{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);margin:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--mute)}
.tbl td:first-child{font-weight:700;color:var(--brand);white-space:nowrap}
.tblwrap{max-height:420px;overflow:auto}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.steps a{font-size:12px;font-weight:600;text-decoration:none;color:var(--blue-ink);background:var(--blue);border-radius:999px;padding:2px 10px}
.warnbox{font-size:13px;background:var(--hi);border-radius:10px;padding:8px 12px;margin-top:8px}
</style>

<script>
var SHEET_URL = window.GWE_SHEET_URL || '';
var LESSONS = window.FCE_LESSONS || [];
var B = parseInt(new URLSearchParams(location.search).get('b'), 10) || 0;
if(B < 1 || B > LESSONS.length || !LESSONS[B - 1].items.length) B = 0;
var KIND = {pv:'Phrasal verb', prep:'Giới từ đi kèm', coll:'Collocation'};
var POOL = {
  pv:['up','down','in','out','on','off','over','away','back','about','after','into','through','for','across','by','round','along','with'],
  prep:['in','on','at','of','to','for','with','from','about','by','into'],
  coll:['make','do','take','have','give','keep','pay','get']
};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function norm(s){ return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

/* ---------- ngẫu nhiên có hạt giống: cả lớp cùng một đề ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(a, r){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function uniq(a){ var o = []; a.forEach(function(x){ if(o.indexOf(x) < 0) o.push(x); }); return o; }

/* ---------- âm thanh ---------- */
var ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var VOICE = null, CAN_SPEAK = 'speechSynthesis' in window;
function pickVoice(){
  if(!CAN_SPEAK) return;
  var vs = speechSynthesis.getVoices();
  VOICE = vs.filter(function(v){ return /en-GB/i.test(v.lang); })[0] || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
}
if(CAN_SPEAK){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if(!CAN_SPEAK){ alert('Trình duyệt này chưa đọc được âm thanh. Em mở bằng Chrome hoặc Safari nhé.'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = VOICE ? VOICE.lang : 'en-GB'; if(VOICE) u.voice = VOICE;
  u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
function sayBtn(text, cls){ return '<button class="say' + (cls ? ' ' + cls : '') + '" data-say="' + esc(text) + '" aria-label="Nghe: ' + esc(text) + '" title="Nghe">' + ICON + '</button>'; }
function bare(it){ return it.p.replace(/\s*\([^)]*\)/g, ''); }
function spoken(it){ return bare(it).replace(/\bsb\b/g, 'somebody').replace(/\bsth\b/g, 'something').replace(/\//g, ' or '); }

/* ---------- dựng bài ---------- */
var LS, IT, PARTS = [], QMAP = {};
function distract(it, pool, n, r){
  var own = (it.o || []).slice();
  var cand = shuffle(pool.filter(function(x){ return norm(x) !== norm(it.x) && own.indexOf(x) < 0; }), r);
  return own.concat(cand).slice(0, n);
}
function build(){
  LS = LESSONS[B - 1]; IT = LS.items; PARTS = []; QMAP = {};
  var r = rng(B * 7919), order = shuffle(IT.map(function(_, i){ return i; }), r);
  var n = IT.length, third = Math.ceil(n / 3);
  var setA = order.slice(0, third), setB = order.slice(third, 2 * third), setD = order.slice(2 * third);
  function add(P){ P.qs.forEach(function(q, i){ q.id = P.key + (i + 1); q.part = P; QMAP[q.id] = q; }); PARTS.push(P); }

  /* A. Nghe – chọn đúng cụm từ vừa nghe (phân biệt tiểu từ / giới từ) */
  add({key:'A', kind:'listen', name:'Nghe và chọn cụm từ đúng', lead:'Bấm loa để nghe (bấm <b>Chậm</b> để nghe chậm), rồi chọn cụm từ em nghe được. Chú ý tiểu từ / giới từ ở cuối.',
    qs:setA.map(function(i){
      var it = IT[i], ph = bare(it), wrong = distract(it, POOL[it.k], 3, r).map(function(x){ return it.k === 'coll' ? ph.replace(new RegExp('^' + it.x + '\\b'), x) : it.h + ' ' + x; });
      var o = shuffle([ph].concat(wrong), r);
      return {it:it, o:o, a:o.indexOf(ph)};
    })});
  /* B. Nhìn tranh, nghe – chọn nghĩa */
  add({key:'B', kind:'mean', name:'Nhìn tranh, chọn nghĩa đúng', lead:'Đọc cụm từ (bấm loa để nghe cách phát âm), nhìn tranh gợi ý rồi chọn nghĩa tiếng Việt đúng.',
    qs:setB.map(function(i){
      var it = IT[i], others = shuffle(IT.filter(function(x){ return bare(x) !== bare(it) && x.vi !== it.vi; }).map(function(x){ return x.vi; }), r);
      var o = shuffle([it.vi].concat(uniq(others).slice(0, 3)), r);
      return {it:it, o:o, a:o.indexOf(it.vi)};
    })});
  /* C. Điền tiểu từ / giới từ vào câu – cả bài */
  add({key:'C', kind:'gap', name:'Chọn tiểu từ / giới từ đúng cho câu', lead:'Mỗi câu có một chỗ trống. Chọn từ đúng để hoàn thành cụm từ. Gợi ý nghĩa ở dưới câu.',
    qs:shuffle(IT.map(function(_, i){ return i; }), r).map(function(i){
      var it = IT[i], o = shuffle([it.x].concat(distract(it, POOL[it.k], 3, r)), r);
      return {it:it, o:o, a:o.indexOf(it.x)};
    })});
  /* D. Ghép đôi */
  add({key:'D', kind:'match', name:'Trò chơi ghép đôi', lead:'Chạm một cụm từ bên trái, rồi chạm tranh + nghĩa đúng bên phải. Ghép đúng ngay lần đầu mới được điểm.',
    left:shuffle(setD, r), right:shuffle(setD, r),
    qs:setD.map(function(i){ return {it:IT[i], idx:i}; })});
}

/* ---------- trạng thái ---------- */
var KEY, S, PICK = null;
function save(){ store(KEY, S); }
function allQs(){ var a = []; PARTS.forEach(function(p){ a = a.concat(p.qs); }); return a; }
function val(q){ return S.a[q.id]; }
function answered(q){ return q.part.kind === 'match' ? !!(S.m[q.idx]) : val(q) !== undefined; }
function right(q){ return q.part.kind === 'match' ? S.m[q.idx] === 1 : val(q) === q.a; }
function ansText(q){ return q.part.kind === 'match' ? q.it.p + ' = ' + q.it.vi : q.o[q.a]; }
function gotText(q){ if(q.part.kind === 'match') return S.m[q.idx] === 1 ? q.it.p : 'ghép sai lần đầu'; var v = val(q); return v === undefined ? '' : q.o[v]; }
function scoreNow(){
  var sc = 0, max = 0, by = [], wrong = [];
  PARTS.forEach(function(p){
    var g = 0;
    p.qs.forEach(function(q){ if(right(q)) g++; else wrong.push({n:q.id, root:q.it.p, got:gotText(q), ans:ansText(q), type:p.key + '. ' + p.name, mean:q.it.vi}); });
    by.push(p.key + ': ' + g + '/' + p.qs.length); sc += g; max += p.qs.length;
  });
  return {score:sc, max:max, by:by, wrong:wrong};
}

/* ---------- hiển thị ---------- */
function gapSentence(q, shown){
  var it = q.it, v = val(q), fill = v === undefined ? '&nbsp;' : esc(q.o[v]), cls = 'gap';
  if(S.done) cls += right(q) ? ' ok' : ' bad';
  return esc(it.s).replace('___', '<span class="' + cls + '">' + fill + '</span>');
}
function exHtml(q){
  var it = q.it, ok = right(q), h = '<div class="ex' + (ok ? '' : ' bad') + '">';
  h += '<p>' + (ok ? '✓ Đúng · ' : '✗ Đáp án: ') + '<b>' + esc(it.p) + '</b> ' + sayBtn(it.p) + ' = ' + esc(it.vi) + (it.en ? ' <span class="vi">(' + esc(it.en) + ')</span>' : '') + '</p>';
  if(q.part.kind === 'gap' && it.sv) h += '<p class="vi">' + esc(it.sv) + '</p>';
  if(q.part.kind !== 'gap' && it.s) h += '<p class="vi">VD: ' + esc(it.s.replace('___', it.x)) + '</p>';
  return h + '</div>';
}
function optsHtml(q, inline){
  var v = val(q), h = '<div class="opts' + (inline ? ' inline' : '') + '">';
  q.o.forEach(function(o, i){
    var cls = 'opt';
    if(S.done){ if(i === q.a) cls += ' ok'; else if(v === i) cls += ' bad'; }
    else if(v === i) cls += ' sel';
    h += '<button class="' + cls + '" data-q="' + q.id + '" data-o="' + i + '"' + (S.done ? ' disabled' : '') + '>' + (inline ? '' : String.fromCharCode(65 + i) + '. ') + esc(o) + '</button>';
  });
  return h + '</div>';
}
function renderQ(q, first){
  var it = q.it, k = q.part.kind, h = '<div class="q' + (first ? ' first' : '') + '" id="q-' + q.id + '"><span class="qn">' + q.id + '</span>';
  if(k === 'listen'){
    h += '<div class="listen" style="margin-top:6px">' + sayBtn(spoken(it), 'big') + '<button class="say slow" data-say="' + esc(spoken(it)) + '" data-slow="1">Chậm</button><span class="hint">Nghe rồi chọn cụm từ đúng</span></div>' + optsHtml(q);
  } else if(k === 'mean'){
    h += '<div class="pic"><span class="em" aria-hidden="true">' + it.e + '</span><div><span class="prompt" style="font-size:18px">' + esc(bare(it)) + '</span> ' + sayBtn(spoken(it)) + '<br><span class="hint">' + esc(KIND[it.k]) + '</span></div></div>' + optsHtml(q);
  } else if(k === 'gap'){
    h += '<span class="prompt">' + gapSentence(q) + '</span><br><span class="hint">' + it.e + ' Gợi ý: ' + esc(it.vi) + '</span>' + optsHtml(q, true);
  }
  if(S.done) h += exHtml(q);
  return h + '</div>';
}
function renderMatch(p){
  var h = '<div class="match" id="q-' + p.qs[0].id + '"><div class="col">';
  p.left.forEach(function(i){
    var it = IT[i], done = !!S.m[i];
    h += '<button class="tile ph' + (done ? ' done' : '') + (PICK === i ? ' on' : '') + '" data-ml="' + i + '"' + (done || S.done ? ' disabled' : '') + '>' + esc(bare(it)) + '</button>';
  });
  h += '</div><div class="col">';
  p.right.forEach(function(i){
    var it = IT[i], done = !!S.m[i];
    h += '<button class="tile' + (done ? ' done' : '') + '" data-mr="' + i + '"' + (done || S.done ? ' disabled' : '') + '><span class="em" aria-hidden="true">' + it.e + '</span>' + esc(it.vi) + '</button>';
  });
  var got = p.qs.filter(function(q){ return S.m[q.idx]; }).length;
  h += '</div></div><p class="msg" id="mMsg">Đã ghép: ' + got + '/' + p.qs.length + '</p>';
  if(S.done){ p.qs.forEach(function(q){ h += '<div class="q"><span class="qn">' + q.id + '</span>' + exHtml(q) + '</div>'; }); }
  return h;
}
function cardsHtml(){
  var h = '<h3 class="part" id="the-tu">Học trước · Thẻ từ <small>(' + IT.length + ' từ · không chấm điểm)</small></h3><p class="lead">Chạm thẻ để xem nghĩa và câu ví dụ, bấm loa để nghe phát âm. Học hết các thẻ rồi làm bài bên dưới.</p><div class="deck">';
  IT.forEach(function(it, i){
    var open = S.c[i];
    h += '<div class="fc' + (open ? ' open seen' : '') + '" data-card="' + i + '" role="button" tabindex="0"><span class="em" aria-hidden="true">' + it.e + '</span><span class="ph">' + esc(it.p) + '</span><span class="tag">' + esc(KIND[it.k]) + '</span>' + sayBtn(spoken(it)) +
      '<span class="tap">Chạm để xem nghĩa</span><span class="back2"><span class="vi">' + esc(it.vi) + '</span><br><span class="en">' + esc(it.en || '') + '</span><br><i>' + esc(it.s.replace('___', it.x)) + '</i></span></div>';
  });
  var seen = IT.filter(function(_, i){ return S.c[i]; }).length;
  return h + '</div><p class="msg">Đã xem ' + seen + '/' + IT.length + ' thẻ.</p>';
}
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function speakHtml(){
  var h = '<h3 class="part" id="noi-thu">Luyện nói · Đọc to từng cụm từ <small>(không chấm điểm)</small></h3>';
  if(!SR) return h + '<p class="lead">Máy của em chưa hỗ trợ nhận giọng nói (hãy thử Chrome trên Android/máy tính). Em vẫn có thể bấm loa, nghe và đọc theo.</p>' + IT.map(function(it){ return '<div class="spk">' + sayBtn(spoken(it)) + '<span class="w">' + esc(it.p) + '</span></div>'; }).join('');
  h += '<p class="lead">Bấm loa nghe mẫu, rồi bấm <b>🎤 Nói</b> và đọc to cụm từ. Máy nghe được đúng sẽ hiện ✓.</p>';
  IT.forEach(function(it, i){
    var r = S.sp[i];
    h += '<div class="spk">' + sayBtn(spoken(it)) + '<span class="w">' + esc(it.p) + '</span><button class="mic" data-mic="' + i + '">🎤 Nói</button><span class="res' + (r === 1 ? ' ok' : '') + '" id="sp-' + i + '">' + (r === 1 ? '✓ Chuẩn rồi!' : '') + '</span></div>';
  });
  return h;
}
function title(){ return 'Bài ' + B + ' · ' + LS.t; }
function render(){
  var h = '<div class="card"><h2>' + esc(title()) + '</h2>';
  var nq = allQs().length;
  if(S.done){
    var sc = scoreNow();
    h += '<div class="score" style="margin-top:10px"><span class="big">' + sc.score + '/' + sc.max + '</span><span class="msg">' + sc.by.join(' · ') + '<br>' + (S.review ? 'Lần ôn lại' : 'Lần nộp chính') + (S.first ? ' · Điểm lần đầu gửi cô: ' + S.first.score + '/' + S.first.max : '') + '</span></div>';
    h += '<p class="msg' + (S.sent ? ' ok' : '') + '" id="sendMsg">' + (S.sent ? '✓ Đã gửi kết quả cho cô.' : (S.review ? '' : 'Đang gửi kết quả cho cô…')) + '</p>';
    if(sc.score === sc.max) h += '<p class="msg ok">Tuyệt vời, em đúng hết cả bài!</p>';
    else h += '<div class="warnbox">Các từ em cần ôn lại: <b>' + uniq(sc.wrong.map(function(w){ return w.root; })).map(esc).join(', ') + '</b></div>';
    h += '<div class="row"><button class="btn ghost" data-act="redo">Làm lại để ôn</button>' + (B < LESSONS.length && LESSONS[B].items.length ? '<a class="btn" href="?b=' + (B + 1) + '">Sang Bài ' + (B + 1) + ' →</a>' : '') + '</div>';
  } else {
    h += '<p class="lead">' + esc(LS.sub) + ' · ' + IT.length + ' từ · ' + nq + ' câu chấm điểm. Học thẻ từ trước, làm hết 4 phần rồi bấm <b>Nộp bài</b> ở cuối trang.</p>';
    h += '<div class="steps"><a href="#the-tu">Thẻ từ</a>' + PARTS.map(function(p){ return '<a href="#p-' + p.key + '">' + p.key + '. ' + esc(p.name) + '</a>'; }).join('') + '<a href="#noi-thu">Luyện nói</a></div>';
    if(!CAN_SPEAK) h += '<p class="warnbox">Trình duyệt này chưa phát được âm thanh. Em nên mở bằng Chrome hoặc Safari để làm phần Nghe.</p>';
  }
  h += cardsHtml();
  PARTS.forEach(function(p){
    h += '<h3 class="part" id="p-' + p.key + '">Phần ' + p.key + ' · ' + esc(p.name) + ' <small>(' + p.qs.length + ' câu)</small></h3><p class="lead">' + p.lead + '</p>';
    if(p.kind === 'match') h += renderMatch(p);
    else p.qs.forEach(function(q, i){ h += renderQ(q, i === 0); });
  });
  if(!S.done) h += '<div class="row"><button class="btn" data-act="submit">Nộp bài ' + B + '</button><span class="msg" id="subMsg"></span></div>';
  h += speakHtml();
  var y = window.scrollY;
  $('main').innerHTML = h + '</div>';
  window.scrollTo(0, y);
}

/* ---------- trang danh sách + tra cứu kho ---------- */
function hub(){
  var total = 0, h = '<div class="hub">';
  LESSONS.forEach(function(ls, i){
    var b = i + 1, st = load('gwe-fce-b' + b), n = ls.items.length; total += n;
    var done = st && st.first ? '<span class="ok">✓ Đã nộp · ' + st.first.score + '/' + st.first.max + '</span>' : '';
    h += '<a class="mlink' + (n ? '' : ' soon') + '" href="?b=' + b + '"><span class="num">' + b + '</span><span class="t"><b>' + esc(ls.t) + '</b><span>' + esc(ls.sub) + (n ? ' · ' + n + ' từ' : ' · đang soạn') + '</span>' + done + '</span><span class="go">›</span></a>';
  });
  h += '</div><div class="card"><h2>Tra cứu kho từ</h2><p class="lead">' + total + ' cụm từ đã có trong kho. Gõ để tìm (tiếng Anh hoặc tiếng Việt).</p><input class="search" id="q" placeholder="VD: break, giới thiệu, at…"><div class="tblwrap"><table class="tbl"><thead><tr><th>Cụm từ</th><th>Nghĩa</th><th>Bài</th></tr></thead><tbody id="tb"></tbody></table></div></div>';
  $('main').innerHTML = h;
  function fill(){
    var k = norm($('q').value), rows = '';
    LESSONS.forEach(function(ls, i){ ls.items.forEach(function(it){
      if(k && (norm(it.p) + ' ' + norm(it.vi)).indexOf(k) < 0) return;
      rows += '<tr><td>' + esc(it.p) + ' ' + sayBtn(spoken(it)) + '</td><td>' + esc(it.vi) + '</td><td>' + (i + 1) + '</td></tr>';
    }); });
    $('tb').innerHTML = rows || '<tr><td colspan="3">Không tìm thấy.</td></tr>';
  }
  $('q').addEventListener('input', fill); fill();
}

/* ---------- thao tác ---------- */
function setAns(id, v){ S.a[id] = v; save(); }
function matchTry(i){
  var p = PARTS.filter(function(x){ return x.kind === 'match'; })[0];
  if(PICK === null){ return; }
  var el = document.querySelector('[data-mr="' + i + '"]');
  if(i === PICK || (!S.m[i] && bare(IT[i]) === bare(IT[PICK]))){
    /* hai nghĩa của cùng một cụm (vd. break up) có thẻ trái giống hệt nhau → ghép thẻ nào cũng đúng */
    if(i !== PICK){ var t = S.mx[i]; S.mx[i] = S.mx[PICK]; S.mx[PICK] = t; }
    S.m[i] = S.mx[i] ? 2 : 1; PICK = null; save(); render();
  }
  else {
    S.mx[PICK] = 1; save();
    if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    var m = $('mMsg'); if(m){ m.className = 'msg warn'; m.textContent = 'Chưa đúng, em thử lại nhé!'; }
  }
}
function listenMic(i){
  var it = IT[i], rec = new SR(), btn = document.querySelector('[data-mic="' + i + '"]'), out = $('sp-' + i);
  rec.lang = 'en-GB'; rec.maxAlternatives = 5; rec.interimResults = false;
  btn.classList.add('rec'); btn.textContent = '● Đang nghe…';
  rec.onresult = function(e){
    var alts = [].map.call(e.results[0], function(a){ return norm(a.transcript).replace(/[^a-z' ]/g, ''); });
    var want = norm(spoken(it)).replace(/[^a-z' ]/g, '');
    var ok = alts.some(function(a){ return a === want || a.indexOf(want) >= 0; });
    if(ok){ S.sp[i] = 1; save(); out.className = 'res ok'; out.textContent = '✓ Chuẩn rồi!'; }
    else { out.className = 'res'; out.textContent = 'Máy nghe thành: “' + alts[0] + '”. Em nghe mẫu và thử lại nhé.'; }
  };
  rec.onerror = function(){ out.className = 'res'; out.textContent = 'Không nghe được. Em cho phép dùng micro rồi thử lại.'; };
  rec.onend = function(){ btn.classList.remove('rec'); btn.textContent = '🎤 Nói'; };
  rec.start();
}
document.addEventListener('click', function(e){
  var s = e.target.closest('[data-say]');
  if(s){ e.stopPropagation(); return speak(s.dataset.say, !!s.dataset.slow); }
  var t = e.target.closest('button, .fc'); if(!t) return;
  if(t.dataset.card !== undefined){ var c = +t.dataset.card; S.c[c] = !S.c[c] ? 1 : 0; if(S.c[c]) speak(spoken(IT[c])); save(); return render(); }
  if(t.dataset.mic !== undefined) return listenMic(+t.dataset.mic);
  if(t.dataset.act === 'submit') return submit();
  if(t.dataset.act === 'redo') return redo();
  if(t.dataset.act === 'resend') return send();
  if(S.done) return;
  if(t.dataset.ml !== undefined){ PICK = +t.dataset.ml; speak(spoken(IT[PICK])); return render(); }
  if(t.dataset.mr !== undefined) return matchTry(+t.dataset.mr);
  if(t.dataset.o !== undefined){ setAns(t.dataset.q, +t.dataset.o); return render(); }
});
document.addEventListener('keydown', function(e){ if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('fc')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input', function(e){
  if(e.target.id === 'sName' || e.target.id === 'sClass') store('gwe-fce-info', {n:$('sName').value, c:$('sClass').value});
});

function submit(){
  var msg = $('subMsg');
  if(!$('sName').value.trim() || !$('sClass').value.trim()){ msg.className = 'msg warn'; msg.textContent = 'Em nhập họ tên và lớp ở trên trước nhé.'; $('sName').focus(); return; }
  var miss = allQs().filter(function(q){ return !answered(q); });
  [].forEach.call(document.querySelectorAll('.miss'), function(x){ x.classList.remove('miss'); });
  if(miss.length){
    var ids = uniq(miss.map(function(q){ return q.part.kind === 'match' ? 'Phần D' : q.id; }));
    msg.className = 'msg warn';
    msg.textContent = 'Còn ' + miss.length + ' câu chưa làm: ' + ids.slice(0, 8).join(', ') + (ids.length > 8 ? '…' : '') + '.';
    miss.forEach(function(q){ var el = $('q-' + q.id) || $('q-' + q.part.qs[0].id); if(el) el.classList.add('miss'); });
    var f = $('q-' + miss[0].id) || $('q-' + miss[0].part.qs[0].id); if(f) f.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  S.done = true; PICK = null;
  if(!S.first){ var sc = scoreNow(); S.first = {score:sc.score, max:sc.max, wrong:sc.wrong}; }
  save(); render(); window.scrollTo(0, 0);
  if(!S.review && !S.sent) send();
}
function redo(){
  S = {a:{}, m:{}, mx:{}, c:S.c, sp:S.sp, done:false, first:S.first, sent:S.sent, review:true};
  save(); render(); window.scrollTo(0, 0);
}
function send(){
  if(!SHEET_URL || !S.first) return;
  var payload = {type:'wordform', name:$('sName').value.trim(), cls:$('sClass').value.trim(), unit:'Cụm động từ & Giới từ FCE',
    section:title(), score:S.first.score, max:S.first.max, wrong:S.first.wrong};
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(){ S.sent = true; save(); var m = $('sendMsg'); if(m){ m.className = 'msg ok'; m.textContent = '✓ Đã gửi kết quả cho cô.'; } })
    .catch(function(){ var m = $('sendMsg'); if(m){ m.className = 'msg warn'; m.innerHTML = 'Chưa gửi được (mất mạng?). <button class="btn ghost sm" data-act="resend">Gửi lại</button>'; } });
}

if(!B){ hub(); }
else {
  var inf = load('gwe-fce-info') || {};
  $('sName').value = inf.n || ''; $('sClass').value = inf.c || '';
  $('info').hidden = false; $('toList').hidden = false;
  build();
  KEY = 'gwe-fce-b' + B;
  S = load(KEY) || {};
  S.a = S.a || {}; S.m = S.m || {}; S.mx = S.mx || {}; S.c = S.c || {}; S.sp = S.sp || {};
  $('h1').textContent = title();
  $('sub').textContent = 'Cụm động từ & Giới từ · ' + LS.src;
  $('rule').innerHTML = 'Làm đủ ' + allQs().length + ' câu mới nộp được. Lần nộp đầu tiên được gửi cho cô. Sau đó em có thể bấm <b>Làm lại để ôn</b> bao nhiêu lần tuỳ thích.';
  document.title = title() + ' · FCE';
  render();
}
</script>
</body></html>
