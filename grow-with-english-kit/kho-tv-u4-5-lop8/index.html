  var t = e.target.closest('button, .fc'); if(!t) return;
  if(t.dataset.step !== undefined) return go(+t.dataset.step);
  if(t.dataset.card !== undefined){ var c = +t.dataset.card; S.c[c] = S.c[c] ? 0 : 1; if(S.c[c]) speak(spoken(IT[c])); save(); return render(); }
  if(t.dataset.act === 'start') return start();
  if(t.dataset.act === 'redo') return redo();
  if(t.dataset.act === 'nospeak'){ if(confirm('Bỏ qua phần nói? Phần này sẽ không tính điểm.')){ if(LISTENING){ STOPPED = true; try{ REC.abort(); }catch(e){} } S.noSpeak = true; save(); render(); } return; }
  if(t.dataset.act === 'sfx'){ SFX = !SFX; try{ localStorage.setItem(PFX + '-sfx', SFX ? '1' : '0'); }catch(e){} if(SFX) sfx('ok'); return render(); }
  if(t.dataset.act === 'resend') return send();
  if(t.dataset.check !== undefined) return typeCheck(t.dataset.check);
  if(t.dataset.mic !== undefined) return listenMic(+t.dataset.mic);
  if(t.dataset.next !== undefined){
    var p = partOf(t.dataset.next);
    if(p.kind === 'match'){ S.pos[p.key] = 99; save(); render(); sfx('win'); confetti(); return; }
    S.pos[p.key] = (S.pos[p.key] || 0) + 1; save(); render();
    if(S.pos[p.key] >= p.qs.length){ sfx('win'); confetti(); }
    var q = p.qs[S.pos[p.key]]; if(p.kind === 'listen' && q) speak(spoken(q.it));
    if(p.kind === 'type'){ var ti = $('typeIn'); if(ti && !ti.disabled) ti.focus(); }
    return;
  }
  if(t.dataset.ml !== undefined){ PICK = +t.dataset.ml; speak(spoken(IT[PICK])); return render(); }
  if(t.dataset.mr !== undefined) return matchTry(+t.dataset.mr);
  if(t.dataset.o !== undefined){
    var qq = QMAP[t.dataset.q]; if(S.a[qq.id] !== undefined) return;
    S.a[qq.id] = +t.dataset.o; save(); render();
    sfx(right(qq) ? 'ok' : 'bad');
    var pn = (S.pos[qq.part.key] || 0) + 1; if(pn % 10 === 0 && pn < qq.part.qs.length) setTimeout(function(){ sfx('mile'); }, 450);
    if(qq.part.kind !== 'listen') setTimeout(function(){ speak(spoken(qq.it)); }, 550);
  }
});
document.addEventListener('keydown', function(e){
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('fc')){ e.preventDefault(); e.target.click(); }
  if(e.key === 'Enter' && e.target.id === 'typeIn'){ e.preventDefault(); typeCheck(e.target.dataset.tq); }
});
document.addEventListener('input', function(e){
  if(e.target.id === 'sName' || e.target.id === 'sClass') store(PFX + '-info', {n:$('sName').value, c:$('sClass').value});
});
function start(){
  var inf = info(), m = $('startMsg');
  if(!(inf.n || '').trim() || !(inf.c || '').trim()){ m.className = 'msg warn'; m.textContent = 'Em nhập họ tên và lớp trước nhé.'; ($('sName').value ? $('sClass') : $('sName')).focus(); return; }
  S.started = true; save(); render();
  var mp = document.querySelector('.stations'); if(mp) window.scrollTo(0, $('main').offsetTop - 10);
}
function finish(){
  var sc = scoreNow(); S.first = {score:sc.score, max:sc.max, wrong:sc.wrong, noSpeak:speakOff()}; save(); render();
  if(!S.review && !S.sent) send();
}
function redo(){ S = fresh(S); save(); go(0); }
function send(){
  if(!SHEET_URL || !S.first) return;
  var inf = info();
  var payload = {type:'wordform', name:(inf.n || '').trim(), cls:(inf.c || '').trim(), unit:'Kho từ vựng Unit 4–5 · Lớp 8',
    section:title() + (S.first.noSpeak ? ' (không chấm phần nói)' : ''), score:S.first.score, max:S.first.max, wrong:S.first.wrong};
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(){ S.sent = true; save(); var m = $('sendMsg'); if(m){ m.className = 'msg ok'; m.textContent = '✓ Đã gửi kết quả cho cô.'; } })
    .catch(function(){ var m = $('sendMsg'); if(m){ m.className = 'msg warn'; m.innerHTML = 'Chưa gửi được (mất mạng?). <button class="btn ghost sm" data-act="resend">Gửi lại</button>'; } });
}

if(!B){ hub(); }
else {
  try{ $('toList').hidden = localStorage.getItem('gwe-gv') !== '1'; }catch(e){}
  build();
  KEY = PFX + '-b' + B;
  S = load(KEY) || fresh();
  ['a','m','mx','sp','w','pos','c'].forEach(function(k){ S[k] = S[k] || {}; });
  if(!(S.step < STEPS.length) || !unlocked(S.step)) S.step = 0;
  $('h1').textContent = title();
  $('sub').textContent = (UNITS[LS.u] || '') + ' · Global Success 8 · ' + LS.sub.replace(/^Unit \d+ · /, '');
  document.title = title() + ' · Lớp 8';
  render();
}
</script>
</body></html>
