<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="icon" href="/favicon.ico?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Từ vựng SGK + SBT · Unit 4–5 · Lớp 12</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* 4 bài (?b=1…4): làm đủ mọi câu → nộp (gửi điểm + câu sai về Sheet, type 'wordform') → hiện đáp án; "Làm lại để ôn" không gửi lại */
:root{
  --bg:#f7f6f0; --card:#ffffff; --ink:#22301c; --mute:#5d6957; --line:#e2e4d8;
  --brand:#3f6e2a; --brand-ink:#ffffff; --hi:#fde5d3; --hi-line:#e8a274; --green:#5a923f; --orange:#e8742f;
  --ok:#17703f; --ok-bg:#e3f1dc; --bad:#b0391a; --bad-bg:#fde8e3; --chip:#eef4e8; --blue:#cfe8f7; --blue-ink:#0b5d8a;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; --blue:#163447; --blue-ink:#9fd3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; --blue:#163447; --blue-ink:#9fd3f2; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px 18px}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:10px;border-bottom:3px solid var(--orange);font:italic 700 15px/1.2 "Times New Roman",Georgia,serif}
.brandrow img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex:0 0 auto}
.brandrow .gwe{color:var(--green)} .brandrow .msm{color:var(--orange);margin-left:auto;text-align:right}
.banner h1{color:var(--brand);font:700 26px/1.2 var(--f-display);margin:4px 0 2px}
.banner p{margin:0;color:var(--mute)}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;margin-right:12px}
.back[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.info{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.info label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.info input{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.rule{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:13px}
@media(max-width:560px){.info{grid-template-columns:1fr}}
h2{font:700 22px/1.2 var(--f-display);margin:0}
.lead{margin:4px 0 8px;color:var(--mute);font-size:14px}
.part{font:700 18px/1.3 var(--f-display);margin:22px 0 0;padding-top:12px;border-top:2px solid var(--line);color:var(--orange)}
.src{display:inline-block;font:600 12px var(--f-body);color:var(--blue-ink);background:var(--blue);border-radius:6px;padding:1px 8px;margin-top:4px}
.q{border-top:1px dashed var(--line);padding:12px 0 4px}
.q.first{border-top:0}
.q.miss{outline:2px dashed var(--bad);outline-offset:4px;border-radius:8px}
.qn{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:7px;background:var(--hi);font-weight:700;font-size:12px;margin-right:6px;padding:0 4px}
.prompt{font-weight:600}
.blank{font:inherit;width:12em;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--hi-line);background:var(--chip);color:var(--ink);border-radius:6px 6px 0 0}
.blank.wide{width:100%;margin-top:6px}
.blank:focus{outline:2px solid var(--brand);outline-offset:1px}
.blank.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.blank.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.hint{font-weight:700;color:var(--orange);margin:0 6px}
.pic{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pic img{width:150px;max-width:42vw;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.pic .body{flex:1;min-width:180px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.opts.inline{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.opts.inline .opt{padding:5px 12px;font-size:14px}
.opt:hover{border-color:var(--green)}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt.miss2{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.opt:disabled{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;padding:10px;border-radius:12px;background:var(--hi)}
.chip{font:600 14px var(--f-body);border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--green)}
.chip.used{opacity:.45}
.ex{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:14px;background:var(--ok-bg)}
.ex.bad{background:var(--bad-bg)}
.ex b{color:var(--ok)} .ex.bad b{color:var(--bad)}
.ex p{margin:2px 0}
.ex .vi{color:var(--mute);font-style:italic}
.btn{font:600 14px var(--f-body);background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.msg{font-size:13px;color:var(--mute)}
.msg.warn{color:var(--bad);font-weight:600}
.msg.ok{color:var(--ok);font-weight:600}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 34px/1 var(--f-display);color:var(--brand)}
.hub{display:grid;gap:10px}
.mlink{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.mlink:hover{border-color:var(--brand)}
.mlink .num{flex:0 0 auto;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--hi);color:var(--orange);font:700 22px/1 var(--f-display)}
.mlink .t{flex:1;min-width:0}
.mlink .t b{display:block;font:700 18px/1.25 var(--f-display);color:var(--brand)}
.mlink .t span{display:block;font-size:13px;color:var(--mute)}
.mlink .t span.ok{color:var(--ok);font-weight:600}
.mlink .go{color:var(--brand);font-weight:700;font-size:20px}
/* tìm chữ */
.wsbox{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin-top:8px}
.wsg{display:grid;grid-template-columns:repeat(var(--n,10),1fr);gap:3px;width:min(100%,440px);user-select:none}
.wsg button{aspect-ratio:1;font:700 clamp(13px,3.6vw,17px) var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:0;cursor:pointer}
.wsg button.found{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.wsg button.start{background:var(--orange);color:#fff;border-color:var(--orange)}
.wsl{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:160px;align-content:flex-start}
.wsl span{padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.wsl span.found{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);text-decoration:line-through}
/* ô chữ */
.cwg{display:grid;grid-template-columns:28px repeat(9,1fr);gap:2px;width:min(100%,380px);margin:10px 0}
.cwg div{aspect-ratio:1;display:grid;place-items:center;font:700 15px var(--f-body);text-transform:lowercase}
.cwg .c{border:1.5px solid var(--blue-ink);background:var(--card)}
.cwg .c.blue{background:var(--blue)}
.cwg .c.ok{color:var(--ok)} .cwg .c.bad{color:var(--bad)}
.cwg .n{font-size:12px;color:var(--mute);font-weight:600}
.len{font-size:13px;color:var(--mute)}
</style>

<script>
var UNIT = 'Từ vựng SGK + SBT Unit 4–5 – Lớp 12';
var SHEET_URL = window.GWE_SHEET_URL || '';
var NB = BAI.length;
var B = parseInt(new URLSearchParams(location.search).get('b'), 10) || 0;
if(B < 1 || B > NB) B = 0;
var LET = 'ABCDEFGHIJ';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function strip(h){ return String(h).replace(/<[^>]+>/g, ''); }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- chuẩn hoá đáp án ---------- */
function base(s){
  return String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[-‐–]/g, ' ').replace(/[.!?,;:]+/g, ' ')
    .replace(/\s+/g, ' ').trim().replace(/theater/g, 'theatre').replace(/colorful/g, 'colourful');
}
function norm(s){ return base(s).replace(/^(a|an|the) /, ''); }
var NUMW = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twenty:20,thirty:30,forty:40,fifty:50};
var UNITW = {kilo:'kg',kilos:'kg',kilogram:'kg',kilograms:'kg',kilogramme:'kg',kilogrammes:'kg',kg:'kg',kgs:'kg',
  gram:'g',grams:'g',gramme:'g',grammes:'g',g:'g',gr:'g',gs:'g',
  millilitre:'ml',millilitres:'ml',milliliter:'ml',milliliters:'ml',ml:'ml',mls:'ml',
  litre:'l',litres:'l',liter:'l',liters:'l',l:'l',
  teaspoon:'tsp',teaspoons:'tsp',teaspoonful:'tsp',tsp:'tsp',tsps:'tsp',
  tablespoon:'tbsp',tablespoons:'tbsp',tablespoonful:'tbsp',tbsp:'tbsp',tbsps:'tbsp'};
function qn(s){
  var t = base(s).replace(/(\d)([a-z])/g, '$1 $2').split(' '), out = [];
  for(var i = 0; i < t.length; i++){
    var w = t[i];
    if(/^\d+$/.test(w)) out.push(+w);
    else if(NUMW[w] !== undefined){
      if(typeof out[out.length - 1] === 'number') out[out.length - 1] += NUMW[w]; else out.push(NUMW[w]);
    }
    else if(w === 'hundred' && typeof out[out.length - 1] === 'number') out[out.length - 1] *= 100;
    else if((w === 'a' || w === 'an') && UNITW[t[i + 1]]) out.push(1);
    else if(UNITW[w] && typeof out[out.length - 1] === 'number') out.push(UNITW[w]);
    else out.push(w);
  }
  return out.join(' ');
}

/* ---------- dựng câu hỏi ---------- */
var BK = BAI[B - 1], PARTS = [], QMAP = {};
function build(){
  PARTS = []; QMAP = {};
  if(!BK) return;
  BK.parts.forEach(function(p, pi){
    var P = {key:LET[pi], name:p.name, src:p.src, lead:p.lead || '', kind:p.kind, inline:p.inline, bank:p.bank, grid:p.grid, rows:p.rows, qs:[]};
    p.qs.forEach(function(x, i){
      var q = {}; for(var k in x) q[k] = x[k];
      q.id = P.key + (i + 1); q.kind = p.kind; q.part = P;
      P.qs.push(q); QMAP[q.id] = q;
    });
    PARTS.push(P);
  });
}

/* ---------- trạng thái ---------- */
var KEY = 'gwe-tv12u45-b' + B, S, LASTF = null, WSSEL = null;
function save(){ store(KEY, S); }
function allQs(){ var a = []; PARTS.forEach(function(p){ a = a.concat(p.qs); }); return a; }
function val(q){ return S.a[q.id]; }
function answered(q){
  var v = val(q);
  if(q.kind === 'mcq') return v !== undefined && v !== null;
  if(q.kind === 'multi') return !!(v && v.length);
  if(q.kind === 'ws') return v === 1;
  return !!(v || '').trim();
}
function right(q){
  var v = val(q);
  if(q.kind === 'mcq') return v === q.a;
  if(q.kind === 'multi'){ var x = (v || []).slice().sort().join(','); return x === q.a.slice().sort().join(','); }
  if(q.kind === 'ws') return v === 1;
  if(q.kind === 'qty') return q.a.some(function(a){ return qn(a) === qn(v); });
  return q.a.some(function(a){ return norm(a) === norm(v); });
}
function gotText(q){
  var v = val(q);
  if(q.kind === 'mcq') return v === undefined ? '' : q.o[v];
  if(q.kind === 'multi') return (v || []).map(function(i){ return q.o[i]; }).join(', ');
  if(q.kind === 'ws') return v ? q.w : '';
  return v || '';
}
function ansText(q){
  if(q.kind === 'mcq') return q.o[q.a];
  if(q.kind === 'multi') return q.a.map(function(i){ return q.o[i]; }).join(', ');
  if(q.kind === 'ws') return q.w;
  return q.a.join(' / ');
}
function rootText(q){ return strip(q.s || q.p || q.w || (q.img ? 'Tranh ' + q.id : '') || q.id); }
function scoreNow(){
  var sc = 0, max = 0, by = [], wrong = [];
  PARTS.forEach(function(p){
    var g = 0;
    p.qs.forEach(function(q){ if(right(q)) g++; else wrong.push({n:q.id, root:rootText(q), got:gotText(q), ans:ansText(q), type:p.key + '. ' + p.name, mean:q.vi || ''}); });
    by.push(p.key + ': ' + g + '/' + p.qs.length); sc += g; max += p.qs.length;
  });
  return {score:sc, max:max, by:by, wrong:wrong};
}

/* ---------- hiển thị ---------- */
function exHtml(q){
  var ok = right(q), h = '<div class="ex' + (ok ? '' : ' bad') + '">';
  h += '<p>' + (ok ? '✓ Đúng' : '✗ Đáp án: <b>' + esc(ansText(q)) + '</b>') + '</p>';
  if(q.vi) h += '<p class="vi">' + esc(q.vi) + '</p>';
  return h + '</div>';
}
function inputHtml(q, wide){
  var v = val(q) || '', cls = 'blank' + (wide ? ' wide' : '') + (S.done ? (right(q) ? ' ok' : ' bad') : '');
  return '<input class="' + cls + '" data-id="' + q.id + '" value="' + esc(v) + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (S.done ? ' disabled' : '') + (q.kind === 'cw' && q.row ? ' maxlength="' + cwWord(q.row).length + '"' : '') + ' aria-label="Câu ' + q.id + '">';
}
function optsHtml(q){
  var v = val(q), h = '<div class="opts' + (q.part.inline ? ' inline' : '') + '">';
  q.o.forEach(function(o, i){
    var cls = 'opt', on = q.kind === 'multi' ? (v || []).indexOf(i) >= 0 : v === i, isAns = q.kind === 'multi' ? q.a.indexOf(i) >= 0 : q.a === i;
    if(S.done){ if(isAns && on) cls += ' ok'; else if(isAns) cls += q.kind === 'multi' ? ' miss2' : ' ok'; else if(on) cls += ' bad'; }
    else if(on) cls += ' sel';
    h += '<button class="' + cls + '" data-q="' + q.id + '" data-o="' + i + '"' + (S.done ? ' disabled' : '') + '>' + (q.part.inline || q.kind === 'multi' ? '' : String.fromCharCode(65 + i) + '. ') + esc(o) + '</button>';
  });
  return h + '</div>';
}
function renderQ(q, first){
  var h = '<div class="q' + (first ? ' first' : '') + '" id="q-' + q.id + '"><span class="qn">' + q.id + '</span>', body = '';
  if(q.kind === 'mcq' || q.kind === 'multi'){
    body = (q.p ? '<span class="prompt">' + q.p.replace('___', '<b>_____</b>') + '</span>' : '') + optsHtml(q);
  } else if(q.kind === 'qty'){
    body = '<span class="prompt">' + esc(q.p) + '</span>' + inputHtml(q, true);
  } else if(q.kind === 'cw'){
    body = q.row ? '<span class="len">Hàng ' + q.row + ' · ' + cwWord(q.row).length + ' chữ cái</span><br>' + inputHtml(q) : '<span class="prompt">' + esc(q.p) + '</span> ' + inputHtml(q);
  } else if(q.s){
    var bits = q.s.split('___');
    body = bits[0] + inputHtml(q) + (bits[1] || '') + (q.h ? ' <span class="hint">(' + esc(q.h) + ')</span>' : '');
  } else {
    body = (q.h ? '<span class="hint">' + esc(q.h) + '</span>' : '') + inputHtml(q);
  }
  if(q.img) h += '<div class="pic"><img src="img/' + q.img + '" alt="Tranh câu ' + q.id + '" loading="lazy"><div class="body">' + body + '</div></div>';
  else h += body;
  if(S.done) h += exHtml(q);
  return h + '</div>';
}
/* tìm chữ */
function wsCells(at){
  var r0 = at[0], c0 = at[1], r1 = at[2], c1 = at[3], dr = Math.sign(r1 - r0), dc = Math.sign(c1 - c0), n = Math.max(Math.abs(r1 - r0), Math.abs(c1 - c0)), out = [];
  for(var k = 0; k <= n; k++) out.push((r0 + dr * k) + ',' + (c0 + dc * k));
  return out;
}
function renderWS(p){
  var found = {};
  p.qs.forEach(function(q){ if(val(q) === 1) wsCells(q.at).forEach(function(c){ found[c] = 1; }); });
  var h = '<div class="wsbox" id="q-' + p.qs[0].id + '"><div class="wsg" style="--n:' + p.grid[0].length + '">';
  p.grid.forEach(function(row, r){ row.split('').forEach(function(ch, c){
    var k = r + ',' + c, cls = found[k] ? 'found' : '';
    if(WSSEL && WSSEL[0] === r && WSSEL[1] === c) cls = 'start';
    h += '<button class="' + cls + '" data-ws="' + k + '"' + (S.done ? ' disabled' : '') + '>' + ch + '</button>';
  }); });
  h += '</div><div class="wsl">';
  p.qs.forEach(function(q){ h += '<span class="' + (val(q) === 1 ? 'found' : '') + '" id="q-' + q.id + '">' + esc(q.w) + '</span>'; });
  h += '<p class="msg" id="wsMsg" style="width:100%;margin:6px 0 0">Đã tìm: ' + p.qs.filter(function(q){ return val(q) === 1; }).length + '/' + p.qs.length + '</p></div></div>';
  if(S.done) h += '<div class="ex"><p>' + p.qs.map(function(q){ return '<b>' + esc(q.w) + '</b>: ' + esc(q.vi.split(': ')[1] || ''); }).join(' · ') + '</p></div>';
  return h;
}
function wsTry(r, c){
  var p = PARTS.filter(function(x){ return x.kind === 'ws'; })[0];
  if(!WSSEL){ WSSEL = [r, c]; return render(); }
  var r0 = WSSEL[0], c0 = WSSEL[1]; WSSEL = null;
  var dr = r - r0, dc = c - c0, hit = null;
  if(dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)){
    var s = wsCells([r0, c0, r, c]).map(function(k){ var a = k.split(','); return p.grid[+a[0]][+a[1]]; }).join('').toLowerCase();
    p.qs.forEach(function(q){ if(val(q) !== 1 && (q.w === s || q.w === s.split('').reverse().join(''))) hit = q; });
  }
  if(hit){ S.a[hit.id] = 1; save(); }
  render();
  var m = $('wsMsg'); if(m && !hit && !(r === r0 && c === c0)){ m.className = 'msg warn'; m.textContent = 'Chưa đúng, em thử lại nhé. (Chạm chữ đầu rồi chạm chữ cuối)'; }
}
/* ô chữ */
var CWP = null;
function cwWord(row){ var x = CWP.rows.filter(function(r){ return r[0] === row; })[0]; return x[2]; }
function cwGrid(){
  var p = CWP, h = '<div class="cwg" id="cwg">';
  p.rows.forEach(function(rw){
    var n = rw[0], st = rw[1], w = rw[2], q = p.qs.filter(function(x){ return x.row === n; })[0];
    var typed = n === 1 ? w : (val(q) || '').replace(/\s/g, '');
    h += '<div class="n">' + n + '</div>';
    for(var c = 0; c < 9; c++){
      if(c < st || c >= st + w.length){ h += '<div></div>'; continue; }
      var ch = typed[c - st] || '', cls = 'c' + (c === 4 ? ' blue' : '');
      if(S.done && q) cls += right(q) ? ' ok' : ' bad';
      h += '<div class="' + cls + '">' + esc(ch) + '</div>';
    }
  });
  return h + '</div>';
}
function renderPart(p){
  var h = '<h3 class="part">Phần ' + p.key + ' · ' + esc(p.name) + ' (' + p.qs.length + ' câu)</h3><p class="lead">' + p.lead + '</p>';
  if(p.kind === 'ws') return h + renderWS(p);
  if(p.kind === 'cw'){ CWP = p; h += cwGrid(); }
  if(p.bank){
    var used = p.qs.map(function(q){ return norm(val(q)); });
    h += '<div class="bank">' + p.bank.map(function(lab){ return '<button class="chip' + (used.indexOf(norm(lab)) >= 0 ? ' used' : '') + '" data-chip="' + esc(lab) + '" data-p="' + p.key + '"' + (S.done ? ' disabled' : '') + '>' + esc(lab) + '</button>'; }).join('') + '</div>';
  }
  p.qs.forEach(function(q, i){ h += renderQ(q, i === 0); });
  return h;
}
function title(){ return 'Bài ' + B + ' · ' + BK.t; }
function render(){
  var n = allQs().length, h = '<div class="card"><h2>' + esc(title()) + '</h2>';
  if(S.done){
    var sc = scoreNow();
    h += '<div class="score" style="margin-top:10px"><span class="big">' + sc.score + '/' + sc.max + '</span><span class="msg">' + sc.by.join(' · ') + '<br>' + (S.review ? 'Lần ôn lại' : 'Lần nộp chính') + (S.first ? ' · Điểm lần đầu gửi cô: ' + S.first.score + '/' + S.first.max : '') + '</span></div>';
    h += '<p class="msg' + (S.sent ? ' ok' : '') + '" id="sendMsg">' + (S.sent ? '✓ Đã gửi kết quả cho cô.' : (S.review ? '' : 'Đang gửi kết quả cho cô…')) + '</p>';
    if(sc.score === sc.max) h += '<p class="msg ok">Tuyệt vời, em đúng hết cả bài!</p>';
    h += '<div class="row"><button class="btn ghost" data-act="redo">Làm lại để ôn</button>' + (GV && B < NB ? '<a class="btn" href="?b=' + (B + 1) + '">Sang Bài ' + (B + 1) + ' →</a>' : '') + '</div>';
  } else {
    h += '<p class="lead">' + esc(BK.sub) + ' · ' + n + ' câu, ' + PARTS.length + ' phần. Làm xong tất cả rồi bấm Nộp bài ở cuối trang.</p>';
  }
  PARTS.forEach(function(p){ h += renderPart(p); });
  if(!S.done) h += '<div class="row"><button class="btn" data-act="submit">Nộp bài ' + B + '</button><span class="msg" id="subMsg"></span></div>';
  var y = window.scrollY;
  $('main').innerHTML = h + '</div>';
  window.scrollTo(0, y);
}
function hub(){
  var h = '<div class="hub">';
  BAI.forEach(function(bk, i){
    var b = i + 1, st = load('gwe-tv12u45-b' + b), n = 0;
    bk.parts.forEach(function(p){ n += p.qs.length; });
    var done = st && st.first ? '<span class="ok">✓ Đã nộp · ' + st.first.score + '/' + st.first.max + '</span>' : '';
    h += '<a class="mlink" href="?b=' + b + '"><span class="num">' + b + '</span><span class="t"><b>' + esc(bk.t) + '</b><span>' + esc(bk.sub) + ' · ' + n + ' câu</span>' + done + '</span><span class="go">›</span></a>';
  });
  $('main').innerHTML = h + '</div>';
}

/* ---------- thao tác ---------- */
function setAns(id, v){ S.a[id] = v; save(); }
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.dataset.act === 'submit') return submit();
  if(t.dataset.act === 'redo') return redo();
  if(t.dataset.act === 'resend') return send();
  if(S.done) return;
  if(t.dataset.ws){ var a = t.dataset.ws.split(','); return wsTry(+a[0], +a[1]); }
  if(t.dataset.o !== undefined){
    var q = QMAP[t.dataset.q], o = +t.dataset.o;
    if(q.kind === 'multi'){ var arr = (val(q) || []).slice(), k = arr.indexOf(o); if(k >= 0) arr.splice(k, 1); else arr.push(o); setAns(q.id, arr); }
    else setAns(q.id, o);
    return render();
  }
  if(t.dataset.chip !== undefined){
    var qs = PARTS.filter(function(p){ return p.key === t.dataset.p; })[0].qs, target = null;
    if(LASTF && QMAP[LASTF] && QMAP[LASTF].part.key === t.dataset.p) target = QMAP[LASTF];
    if(!target) target = qs.filter(function(x){ return !(val(x) || '').trim(); })[0];
    if(!target) return;
    setAns(target.id, t.dataset.chip);
    var nx = qs.filter(function(x){ return !(val(x) || '').trim(); })[0];
    LASTF = nx ? nx.id : null; render();
    if(nx){ var el = document.querySelector('input[data-id="' + nx.id + '"]'); if(el) el.focus({preventScroll:true}); }
  }
});
document.addEventListener('focusin', function(e){ if(e.target.dataset && e.target.dataset.id) LASTF = e.target.dataset.id; });
document.addEventListener('input', function(e){
  var id = e.target.dataset && e.target.dataset.id;
  if(id){
    S.a[id] = e.target.value; save();
    if(QMAP[id] && QMAP[id].kind === 'cw'){ var g = $('cwg'); if(g) g.outerHTML = cwGrid(); }
  }
  if(e.target.id === 'sName' || e.target.id === 'sClass') store('gwe-tv12u45-info', {n:$('sName').value, c:$('sClass').value});
});

function submit(){
  var msg = $('subMsg');
  if(!$('sName').value.trim() || !$('sClass').value.trim()){ msg.className = 'msg warn'; msg.textContent = 'Em nhập họ tên và lớp ở trên trước nhé.'; $('sName').focus(); return; }
  var miss = allQs().filter(function(q){ return !answered(q); });
  [].forEach.call(document.querySelectorAll('.miss'), function(x){ x.classList.remove('miss'); });
  if(miss.length){
    msg.className = 'msg warn';
    msg.textContent = 'Còn ' + miss.length + ' câu chưa làm: ' + miss.slice(0, 8).map(function(q){ return q.id; }).join(', ') + (miss.length > 8 ? '…' : '') + '.';
    miss.forEach(function(q){ var el = $('q-' + q.id); if(el) el.classList.add('miss'); });
    var f = $('q-' + miss[0].id); if(f) f.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  S.done = true; WSSEL = null;
  if(!S.first){ var sc = scoreNow(); S.first = {score:sc.score, max:sc.max, wrong:sc.wrong}; }
  save(); render(); window.scrollTo(0, 0);
  if(!S.review && !S.sent) send();
}
function redo(){
  S = {a:{}, done:false, first:S.first, sent:S.sent, review:true};
  save(); render(); window.scrollTo(0, 0);
}
function send(){
  if(!SHEET_URL || !S.first) return;
  var payload = {type:'wordform', name:$('sName').value.trim(), cls:$('sClass').value.trim(), unit:UNIT,
    section:title(), score:S.first.score, max:S.first.max, wrong:S.first.wrong};
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(){ S.sent = true; save(); var m = $('sendMsg'); if(m){ m.className = 'msg ok'; m.textContent = '✓ Đã gửi kết quả cho cô.'; } })
    .catch(function(){ var m = $('sendMsg'); if(m){ m.className = 'msg warn'; m.innerHTML = 'Chưa gửi được (mất mạng?). <button class="btn ghost" data-act="resend">Gửi lại</button>'; } });
}

if(!B){ hub(); }
else {
  var inf = load('gwe-tv12u45-info') || {};
  $('sName').value = inf.n || ''; $('sClass').value = inf.c || '';
  $('info').hidden = false; $('toList').hidden = !GV;
  build();
  S = load(KEY) || {a:{}, done:false, first:null, sent:false, review:false};
  $('h1').textContent = title();
  $('sub').textContent = 'Từ vựng SGK + SBT · Tiếng Anh 12 Global Success';
  $('rule').innerHTML = 'Làm đủ ' + allQs().length + ' câu mới nộp được. Lần nộp đầu tiên được gửi cho cô. Sau đó em có thể bấm <b>Làm lại để ôn</b> bao nhiêu lần tuỳ thích.';
  document.title = title() + ' · Lớp 12';
  render();
}
</script>
</body></html>
