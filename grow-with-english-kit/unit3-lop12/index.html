<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unit 3 Green Living · Lớp 12</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Unit 3 lớp 12: bảng từ + 4 bài; mỗi bài nộp 1 lần rồi khoá, hiện đáp án và giải thích */
:root{
  --bg:#f7f6f0; --card:#ffffff; --ink:#22301c; --mute:#5d6957; --line:#e2e4d8;
  --brand:#3f6e2a; --brand-ink:#ffffff; --hi:#fde5d3; --hi-line:#e8a274; --green:#5a923f; --orange:#e8742f;
  --ok:#17703f; --ok-bg:#e3f1dc; --bad:#b0391a; --bad-bg:#fde8e3; --chip:#eef4e8;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a11; --card:#1b2418; --ink:#e7eee2; --mute:#a3b09b; --line:#2e3a29;
  --brand:#8cc56b; --brand-ink:#0f1f08; --hi:#3e2b1d; --hi-line:#a8643a; --green:#8cc56b; --orange:#f0965c;
  --ok:#8fd99b; --ok-bg:#1b3a22; --bad:#ffa593; --bad-bg:#3d1f1a; --chip:#232f1f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px 18px}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:10px;border-bottom:3px solid var(--orange);font:italic 700 15px/1.2 "Times New Roman",Georgia,serif}
.brandrow img{width:40px;height:40px;object-fit:contain;border-radius:8px;flex:0 0 auto}
.brandrow .gwe{color:var(--green)} .brandrow .msm{color:var(--orange);margin-left:auto;text-align:right}
.banner h1{color:var(--brand);font:700 26px/1.2 var(--f-display);margin:4px 0 2px}
.banner p{margin:0;color:var(--mute)}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.info{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.info label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.info input{font:inherit;font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);min-width:0}
.rule{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:13px}
@media(max-width:560px){.info{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;min-width:112px}
.tab b{display:block;font-size:13px}.tab span{font-size:12px;color:var(--mute)}
.tab.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tab.done span{color:var(--ok);font-weight:600}
h2{font:700 22px/1.2 var(--f-display);margin:0}
.lead{margin:4px 0 0;color:var(--mute);font-size:14px}
.q{border-top:1px dashed var(--line);padding:12px 0 2px}
.q:first-child{border-top:0;padding-top:4px}
.qn{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:7px;background:var(--hi);font-weight:700;font-size:12px;margin-right:6px;padding:0 4px}
.qs{margin:0}
.root{font-weight:700;color:var(--orange);white-space:nowrap}
.blank{font:inherit;width:11em;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--hi-line);background:var(--chip);color:var(--ink);border-radius:6px 6px 0 0}
.blank:focus{outline:2px solid var(--brand);outline-offset:1px}
.blank.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.blank.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.ex{margin-top:8px;border-radius:10px;padding:9px 12px;font-size:14px;background:var(--ok-bg)}
.ex.bad{background:var(--bad-bg)}
.ex .ans{font-weight:700}
.ex .ans b{color:var(--ok)}
.ex.bad .ans b{color:var(--bad)}
.ex p{margin:3px 0}
.ex .vi{color:var(--mute);font-style:italic}
.ex .note{font-size:13px;color:var(--orange)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;background:var(--card);border:1px solid var(--line);margin-left:4px}
.btn{font:600 14px var(--f-body);background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.msg{font-size:13px;color:var(--mute)}
.msg.warn{color:var(--bad);font-weight:600}
.msg.ok{color:var(--ok);font-weight:600}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 34px/1 var(--f-display);color:var(--brand)}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt th,.vt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vt th{font-size:12px;color:var(--mute);font-weight:600}
.vt td.w{font-weight:700;color:var(--brand)}
.vt td.ipa{color:var(--mute);white-space:nowrap}
.tw{overflow-x:auto}
.say{border:0;background:var(--chip);border-radius:7px;cursor:pointer;padding:2px 7px;font-size:14px}
h3.sub{font:700 17px/1.3 var(--f-display);margin:18px 0 6px;color:var(--orange)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
@media(max-width:620px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt b{color:var(--orange);margin-right:4px}
.opt.sel{border-color:var(--brand);background:var(--chip);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.passage{background:var(--chip);border-radius:12px;padding:12px 14px;line-height:1.9;margin-top:8px}
.passage .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--hi-line);text-align:center;font-weight:700;color:var(--brand);padding:0 4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;border:1.5px dashed var(--hi-line);border-radius:12px;padding:10px;margin-top:8px}
.bank span{background:var(--hi);border-radius:7px;padding:2px 9px;font-weight:600;font-size:14px}
.bank span.used{opacity:.4;text-decoration:line-through}
.vi{color:var(--mute);font-style:italic}
</style></head>
<body><div class="wrap">
<header class="banner">
  <div class="brandrow"><img src="../logo.png" alt="Logo Grow with English"><span class="gwe">Grow with English</span><span class="msm">Tiếng Anh Ms. Minh Thư</span></div>
  <a class="back" href="../#khoi-12">← Kho bài tập · Khối 12</a>
  <h1>Unit 3 – Green Living</h1>
  <p>Global Success 12 · Từ vựng: học bảng từ rồi làm 4 bài (50 câu).</p>
</header>

<section class="card info">
  <label>Họ và tên học sinh *<input id="sName" autocomplete="name" placeholder="VD: Nguyễn Minh Anh"></label>
  <label>Lớp *<input id="sClass" placeholder="VD: 12A1"></label>
  <p class="rule">Mỗi bài phải làm đủ mọi câu mới nộp được. Lần nộp đầu tiên của mỗi bài được gửi cho cô; sau đó em có thể bấm <b>Làm lại để ôn</b>.</p>
</section>

<nav class="tabs" id="tabs" aria-label="Các phần"></nav>
<section class="card" id="main"></section>
</div>

<script src="../config.js"></script>
<script src="data.js"></script>
<script>
var SHEET_URL = window.GWE_SHEET_URL || '';
var UNIT = 'Grade 12 - Unit 3 Green Living (Từ vựng)';
var U = window.U, P = U.parts, L = 'ABCD';
var cur = 'vocab';
var S = {};   // S[partId] = {a:{}, done, sent, first:{score,max}, review}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function part(id){ return P.filter(function(p){ return p.id === id; })[0]; }
function st(id){ return S[id] || (S[id] = {a:{}, done:false}); }

/* ---------- lưu trên máy học sinh ---------- */
function save(){ try{ localStorage.setItem('gwe-u3-lop12', JSON.stringify({S:S, cur:cur})); }catch(e){} }
function load(){ try{ var o = JSON.parse(localStorage.getItem('gwe-u3-lop12') || 'null'); if(o){ S = o.S || {}; cur = o.cur || 'vocab'; } }catch(e){} }
function saveWho(){ try{ localStorage.setItem('gwe-who', JSON.stringify({n:$('sName').value, c:$('sClass').value})); }catch(e){} }
function loadWho(){ try{ var o = JSON.parse(localStorage.getItem('gwe-who') || 'null'); if(o){ $('sName').value = o.n || ''; $('sClass').value = o.c || ''; } }catch(e){} }

function speak(t){ try{ var u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function norm(s){ return String(s || '').toLowerCase().replace(/[\s\-–]+/g, ' ').trim(); }

/* ---------- chấm ---------- */
function isRight(p, i){
  var a = st(p.id).a[i];
  return p.type === 'fill' ? norm(a) === norm(p.items[i][0]) : a === p.items[i][2];
}
function answered(p, i){ var a = st(p.id).a[i]; return p.type === 'fill' ? !!norm(a) : a !== undefined; }
function score(p){ var n = 0; p.items.forEach(function(x, i){ if(isRight(p, i)) n++; }); return n; }

/* ---------- giao diện ---------- */
function renderTabs(){
  var h = '<button class="tab' + (cur === 'vocab' ? ' on' : '') + '" data-tab="vocab"><b>Từ vựng</b><span>' + U.vocab.length + ' từ · ' + U.phrases.length + ' cụm</span></button>';
  P.forEach(function(p, k){
    var s = S[p.id];
    h += '<button class="tab' + (cur === p.id ? ' on' : '') + (s && s.first ? ' done' : '') + '" data-tab="' + p.id + '"><b>Bài ' + (k + 1) + '</b><span>' + (s && s.first ? 'Đã nộp ' + s.first.score + '/' + s.first.max : p.items.length + ' câu') + '</span></button>';
  });
  $('tabs').innerHTML = h;
}

function renderVocab(){
  var h = '<h2>Từ vựng Unit 3</h2><p class="lead">Bấm 🔊 để nghe phát âm.</p><h3 class="sub">a. Từ vựng</h3><div class="tw"><table class="vt"><tr><th>#</th><th>Word</th><th>Loại</th><th>Phiên âm</th><th>Nghĩa</th></tr>';
  U.vocab.forEach(function(v, i){
    h += '<tr><td>' + (i + 1) + '</td><td class="w">' + esc(v[0]) + ' <button class="say" data-say="' + esc(v[0]) + '" aria-label="Nghe ' + esc(v[0]) + '">🔊</button></td><td>' + esc(v[1]) + '</td><td class="ipa">' + esc(v[2]) + '</td><td>' + esc(v[3]) + '</td></tr>';
  });
  h += '</table></div><h3 class="sub">b. Collocations / phrases</h3><div class="tw"><table class="vt"><tr><th>#</th><th>Cụm từ</th><th>Nghĩa</th></tr>';
  U.phrases.forEach(function(v, i){
    h += '<tr><td>' + (i + 1) + '</td><td class="w">' + esc(v[0]) + ' <button class="say" data-say="' + esc(v[0].replace(/\//g, ', ')) + '" aria-label="Nghe ' + esc(v[0]) + '">🔊</button></td><td>' + esc(v[1]) + '</td></tr>';
  });
  h += '</table></div><div class="row"><button class="btn" data-tab="b1">Làm Bài 1 →</button></div>';
  return h;
}

// câu có <b>…</b> (từ in đậm của Bài 3): thoát ký tự rồi trả lại thẻ b
function rich(s){ return esc(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>'); }

function optsHtml(p, i){
  var s = st(p.id), it = p.items[i], h = '<div class="opts">';
  it[1].forEach(function(o, j){
    var cls = 'opt';
    if(s.done){ if(j === it[2]) cls += ' right'; else if(s.a[i] === j) cls += ' wrong'; }
    else if(s.a[i] === j) cls += ' sel';
    h += '<button class="' + cls + '" data-p="' + p.id + '" data-i="' + i + '" data-j="' + j + '"' + (s.done ? ' disabled' : '') + '><b>' + L[j] + '.</b>' + esc(o) + '</button>';
  });
  return h + '</div>';
}
function exHtml(p, i){
  var it = p.items[i], ok = isRight(p, i);
  return '<div class="ex' + (ok ? '' : ' bad') + '"><p class="ans">' + (ok ? '✓ Đúng: ' : '✗ Đáp án: ') + '<b>' + L[it[2]] + '. ' + esc(it[1][it[2]]) + '</b></p><p>' + esc(it[3]) + '</p>' + (it[4] ? '<p class="vi">Dịch: ' + esc(it[4]) + '</p>' : '') + '</div>';
}

function renderPart(p){
  var s = st(p.id), h = '<h2>' + esc(p.title) + '</h2><p class="lead">' + esc(p.lead) + '</p>';
  if(s.done){
    var sc = score(p), k = P.indexOf(p);
    h += '<div class="score" style="margin-top:8px"><span class="big">' + sc + '/' + p.items.length + '</span><span class="msg">' + (s.review ? 'Lần ôn lại' : 'Lần nộp chính') + (s.first ? ' · Điểm lần đầu gửi cô: ' + s.first.score + '/' + s.first.max : '') + '</span></div>';
    h += '<p class="msg' + (s.sent ? ' ok' : '') + '" id="sendMsg">' + (s.sent ? '✓ Đã gửi kết quả cho cô.' : (s.review ? '' : 'Đang gửi kết quả cho cô…')) + '</p>';
    h += '<div class="row"><button class="btn ghost" data-act="redo">Làm lại để ôn</button>' + (k + 1 < P.length ? '<button class="btn" data-tab="' + P[k + 1].id + '">Sang Bài ' + (k + 2) + ' →</button>' : '') + '</div>';
  }
  if(p.type === 'mcq'){
    p.items.forEach(function(it, i){
      h += '<div class="q"><p class="qs"><span class="qn">' + (i + 1) + '</span>' + rich(it[0]) + '</p>' + optsHtml(p, i) + (s.done ? exHtml(p, i) : '') + '</div>';
    });
  } else if(p.type === 'passage'){
    h += '<div class="passage">' + esc(p.text).replace(/\((\d+)\) ___/g, function(m, d){ var i = +d - 1, a = s.a[i]; return '(' + d + ') <span class="gap">' + (a !== undefined ? esc(p.items[i][1][a]) : '&nbsp;') + '</span>'; }) + '</div>';
    if(s.done) h += '<p class="vi" style="margin-top:8px">Dịch: ' + esc(p.vi) + '</p>';
    p.items.forEach(function(it, i){
      h += '<div class="q"><p class="qs"><span class="qn">' + (i + 1) + '</span>Chỗ trống ' + esc(it[0]) + '</p>' + optsHtml(p, i) + (s.done ? exHtml(p, i) : '') + '</div>';
    });
  } else {
    var used = {};
    p.items.forEach(function(x, i){ var a = norm(s.a[i]); if(a) used[a] = 1; });
    h += '<div class="bank">' + p.bank.map(function(w){ return '<span' + (used[norm(w)] ? ' class="used"' : '') + '>' + esc(w) + '</span>'; }).join('') + '</div>';
    h += '<div class="passage">' + esc(p.text).replace(/\((\d+)\) ___/g, function(m, d){
      var i = +d - 1, cls = s.done ? (isRight(p, i) ? ' ok' : ' bad') : '';
      return '(' + d + ') <input class="blank' + cls + '" data-p="' + p.id + '" data-i="' + i + '" value="' + esc(s.a[i] || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (s.done ? ' readonly' : '') + ' aria-label="Chỗ trống ' + d + '">';
    }) + '</div>';
    if(s.done){
      h += '<p class="vi" style="margin-top:8px">Dịch: ' + esc(p.vi) + '</p>';
      p.items.forEach(function(it, i){
        var ok = isRight(p, i);
        h += '<div class="ex' + (ok ? '' : ' bad') + '"><p class="ans"><span class="qn">' + (i + 1) + '</span>' + (ok ? '✓ Đúng: ' : '✗ Đáp án: ') + '<b>' + esc(it[0]) + '</b></p><p>' + esc(it[1]) + '</p></div>';
      });
    }
  }
  if(!s.done) h += '<div class="row"><button class="btn" data-act="submit">Nộp bài</button><span class="msg" id="subMsg"></span></div>';
  return h;
}

function render(){
  renderTabs();
  $('main').innerHTML = cur === 'vocab' ? renderVocab() : renderPart(part(cur));
}

/* ---------- gửi về Google Sheet (cùng định dạng các Unit khác) ---------- */
function send(p){
  if(!SHEET_URL) return;
  var secs = [], tot = 0, max = 0;
  P.forEach(function(x, k){ var s = S[x.id]; if(s && s.first){ secs.push({id:x.id, title:'Bài ' + (k + 1), score:s.first.score, max:s.first.max}); tot += s.first.score; max += s.first.max; } });
  var pct = max ? Math.round(tot / max * 100) : 0;
  var payload = {name:$('sName').value.trim(), cls:$('sClass').value.trim(), unit:UNIT, latest:p.id, sections:secs,
    total:tot, max:max, pct:pct, skills:[{k:'tv', got:tot, max:max}],
    comment:'Từ vựng ' + pct + '%: ' + (pct >= 80 ? 'nắm từ tốt.' : pct >= 50 ? 'cần ôn lại các câu sai.' : 'cần học lại bảng từ rồi làm lại.')};
  var s = st(p.id);
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
    .then(function(){ s.sent = true; save(); var m = $('sendMsg'); if(m && cur === p.id){ m.className = 'msg ok'; m.textContent = '✓ Đã gửi kết quả cho cô.'; } })
    .catch(function(){ var m = $('sendMsg'); if(m && cur === p.id){ m.className = 'msg warn'; m.innerHTML = 'Chưa gửi được (mất mạng?). <button class="btn ghost" data-act="resend">Gửi lại</button>'; } });
}

function submit(){
  var p = part(cur), s = st(p.id), msg = $('subMsg'), miss = [];
  if(!$('sName').value.trim() || !$('sClass').value.trim()){ msg.className = 'msg warn'; msg.textContent = 'Em nhập họ tên và lớp ở trên trước nhé.'; $('sName').focus(); return; }
  p.items.forEach(function(x, i){ if(!answered(p, i)) miss.push(i + 1); });
  if(miss.length){ msg.className = 'msg warn'; msg.textContent = 'Còn ' + miss.length + ' câu chưa làm: ' + miss.join(', '); return; }
  s.done = true;
  var firstTime = !s.first;
  if(firstTime){ s.first = {score:score(p), max:p.items.length}; s.review = false; }
  save(); render(); window.scrollTo({top:$('main').offsetTop - 10, behavior:'smooth'});
  if(firstTime) send(p);
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]');
  if(t){ cur = t.dataset.tab; save(); render(); window.scrollTo({top:$('tabs').offsetTop - 10, behavior:'smooth'}); return; }
  var sy = e.target.closest('[data-say]'); if(sy){ speak(sy.dataset.say); return; }
  var o = e.target.closest('.opt');
  if(o && !o.disabled){ st(o.dataset.p).a[+o.dataset.i] = +o.dataset.j; save(); render(); return; }
  var b = e.target.closest('[data-act]'); if(!b) return;
  var s = st(cur);
  if(b.dataset.act === 'submit') submit();
  else if(b.dataset.act === 'redo'){ s.a = {}; s.done = false; s.review = true; save(); render(); }
  else if(b.dataset.act === 'resend') send(part(cur));
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.classList.contains('blank')){
    st(t.dataset.p).a[+t.dataset.i] = t.value; save();
    var p = part(t.dataset.p), used = {};
    p.items.forEach(function(x, i){ var a = norm(st(p.id).a[i]); if(a) used[a] = 1; });
    [].forEach.call(document.querySelectorAll('.bank span'), function(sp){ sp.classList.toggle('used', !!used[norm(sp.textContent)]); });
  }
  if(t.id === 'sName' || t.id === 'sClass') saveWho();
});

load(); loadWho(); render();
// lần nộp đầu chưa gửi được → gửi lại khi mở trang
P.forEach(function(p){ var s = S[p.id]; if(s && s.first && !s.sent && $('sName').value.trim()) send(p); });
</script>
