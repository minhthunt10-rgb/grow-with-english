  var T=totals(), secs=[];
  STAGES.forEach(function(s){ if(!s.code&&S.done[s.id]) secs.push({id:s.id,title:s.name+' - '+s.title,score:S.score[s.id],max:maxOf(s)}) });
  var sk=[]; for(var x in T.sk) sk.push({k:x,n:SKILLS[x],got:T.sk[x].got,max:T.sk[x].max});
  return {ts:new Date().toISOString(),name:$('sName').value.trim(),cls:$('sClass').value.trim(),unit:UNIT,latest:latest==='c5'?null:latest,sections:secs,total:T.t,max:T.m,pct:T.m?Math.round(T.t/T.m*100):0,skills:sk,comment:comment()};
}
function send(latest,manual){
  if(!SHEET_URL){ if(manual) toast('Bản xem thử chưa gắn Google Sheet. Em dùng Sao chép kết quả nhé.'); return }
  try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(latest))})
    .then(function(){toast('Đã gửi kết quả cho cô.')},function(){toast('Chưa gửi được. Em bấm Sao chép kết quả rồi gửi Zalo nhé.')}); }
  catch(e){toast('Chưa gửi được. Em bấm Sao chép kết quả rồi gửi Zalo nhé.')}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act, st=stage(S.cur);
  if(a==='tab'){S.cur=b.dataset.id;render();window.scrollTo(0,0);if(S.cur==='c2'&&S.t0&&!S.done.c2)startClock();return}
  if(a==='pick'){S.ans[k(st.id,+b.dataset.i)]=+b.dataset.j;save();render();return}
  if(a==='start'){S.t0=Date.now();render();startClock();return}
  if(a==='model'){$('model').hidden=false;return}
  if(a==='copy'){var p=payload(null),t='Reading Quest 1 – '+p.name+' ('+p.cls+'): '+p.total+'/'+p.max+' điểm. '+p.comment;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Đã sao chép. Em dán vào Zalo gửi cô nhé.')},function(){window.prompt('Sao chép kết quả:',t)});return}
  if(a==='send'){ if(!$('sName').value.trim()||!$('sClass').value.trim()){toast('Em nhập họ tên và lớp trước nhé.');return} send(null,true);return}
  if(a==='submit'){
    if(!$('sName').value.trim()||!$('sClass').value.trim()){toast('Em nhập họ tên và lớp ở trên trước nhé.');$('sName').focus();return}
    var miss=items(st).filter(function(x){return !filled(st,x[0],x[1])}).length;
    if(miss){S.warn=true;render();toast('Còn '+miss+' ô chưa làm (viền đỏ).');return}
    if(st.timer&&S.tUsed.c2===undefined) S.tUsed.c2=Date.now()-S.t0;
    S.done[st.id]=true; S.score[st.id]=items(st).filter(function(x){return right(st,x[0],x[1])}).length;
    save(); render(); window.scrollTo(0,0); send(st.id);
    toast(st.name+': '+S.score[st.id]+'/'+maxOf(st)+' điểm.'+(unlocked()&&!S.done.c5?' Mật mã đã mở!':''));
  }
});
document.addEventListener('change',function(e){var t=e.target; if(t.dataset.act==='sel'){S.ans[k(S.cur,+t.dataset.i)]=t.value||undefined;save();renderTabs()}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.dataset.act==='txt'){S.ans[k(S.cur,+t.dataset.i,t.dataset.p)]=t.value;save()}
  if(t.dataset.act==='bonus'){S.bonus=t.value;save()}
  if(t.id==='sName'||t.id==='sClass') save();
});
load(); render();
</script>
</body></html>
